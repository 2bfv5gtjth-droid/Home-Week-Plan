<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Home Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --ink:#151A27; --muted:#667085; --line:#E1E5EC; --line-strong:#C9CFDA;
  --accent:#2F4BF0; --on-accent:#FFFFFF; --ok:#1F9D63; --danger:#D9433B;
  --toast-btn:#9DB0FF;
  --c-s:62%; --c-l:44%; --soft-s:75%; --soft-l:93%; --on-c:#FFFFFF;
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117; --surface:#171B24; --ink:#EDF0F6; --muted:#98A1B3; --line:#252B37; --line-strong:#3A4252;
    --accent:#8DA1FF; --on-accent:#0E1117; --ok:#3CC885; --danger:#F07168;
    --toast-btn:#2F4BF0;
    --c-s:75%; --c-l:68%; --soft-s:38%; --soft-l:21%; --on-c:#0E1117;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#171B24; --ink:#EDF0F6; --muted:#98A1B3; --line:#252B37; --line-strong:#3A4252;
  --accent:#8DA1FF; --on-accent:#0E1117; --ok:#3CC885; --danger:#F07168;
  --toast-btn:#2F4BF0;
  --c-s:75%; --c-l:68%; --soft-s:38%; --soft-l:21%; --on-c:#0E1117;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* category colour scope */
.cat{--c:hsl(var(--h) var(--c-s) var(--c-l));--soft:hsl(var(--h) var(--soft-s) var(--soft-l))}

/* header */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:12px 0 10px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:12px}
#top.compact-top .top-row{margin-bottom:0}
h1{margin:0;font-size:27px;line-height:1.05;font-weight:800;letter-spacing:-.025em;font-variation-settings:"opsz" 72;white-space:nowrap}
#wk{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.wnav{display:flex;gap:6px;flex:none}
.wnav button{height:36px;min-width:36px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:grid;place-items:center}
.wnav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.day .dn{font-size:12px;font-weight:600;color:var(--muted)}
.day .dd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700}
.day .dots{display:flex;gap:3px;height:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) var(--c-s) var(--c-l))}
.dot.done{opacity:.3}
.day.today .dd{background:var(--accent);color:var(--on-accent)}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel .dn{color:inherit;opacity:.7}

/* main */
main{padding-top:6px;padding-bottom:120px;outline:none}
.dayhead h2{margin:8px 0 2px;font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.dayhead p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s ease}
.list{display:flex;flex-direction:column;gap:8px}
.tip{margin:12px 2px 0;color:var(--muted);font-size:13.5px}
.tgrp{margin:16px 0 8px 2px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.tgrp:first-of-type{margin-top:6px}

/* swipe rows */
.swipe{position:relative;border-radius:16px;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.swipe .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:var(--on-bg,#fff);font-weight:700;font-size:15px}
.swipe[data-dir="r"] .bg{background:var(--rbg,var(--ok))}
.swipe[data-dir="l"] .bg{background:var(--danger);color:#fff}
.swipe .bg span{opacity:0;transition:transform .15s}
.swipe[data-dir="r"] .bg-r{opacity:1}
.swipe[data-dir="l"] .bg-l{opacity:1}
.swipe.armed .bg span{transform:scale(1.12)}
.swipe.lib{--rbg:var(--c);--on-bg:var(--on-c)}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:transform .22s cubic-bezier(.2,.8,.2,1);will-change:transform}
.swipe.dragging .card{transition:none}
.tile{flex:none;width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:21px}
.txt{flex:1;min-width:0}
.nm{font-weight:600;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13px;color:var(--muted);margin-top:1px}
.sub .cn{color:var(--c);font-weight:600}
.rep{display:inline-flex;align-items:center}
.rep svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.isdone .nm{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.card.isdone .tile{opacity:.5}
.av{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-size:12px;font-weight:700}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"] svg{opacity:1}
.addbtn{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--c);display:grid;place-items:center;padding:0}
.addbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.planned{flex:none;font-size:12px;font-weight:600;color:var(--c);background:var(--soft);padding:3px 9px;border-radius:99px;white-space:nowrap}
.compact .card{padding:7px 10px;gap:10px}
.compact .tile{width:34px;height:34px;font-size:18px;border-radius:11px}
.compact .nm{font-size:15px}
.compact .check{width:28px;height:28px}
.compact .av{width:24px;height:24px;font-size:11px}

.addmore{width:100%;margin-top:10px;padding:13px;border-radius:16px;border:1.5px dashed var(--line-strong);background:transparent;font-weight:600;font-size:15px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:10px 4px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* empty */
.empty{text-align:center;padding:38px 20px 20px}
.empty .big{font-size:40px;margin-bottom:6px}
.empty h3{margin:0 0 6px;font-size:20px;font-weight:700}
.empty p{margin:0 auto 18px;max-width:30ch;color:var(--muted);font-size:15px}
.empty.small{padding:28px 10px}

/* buttons */
.btn{font-weight:600;font-size:15px;border-radius:12px;padding:11px 16px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.wide{width:100%}

/* welcome card */
.tipcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:8px 0 14px}
.tipcard h3{margin:0 0 8px;font-size:19px;font-weight:700}
.tipcard ul{margin:0 0 14px;padding-left:20px;color:var(--muted);font-size:14.5px}
.tipcard li{margin-bottom:5px}
.tipcard li b{color:var(--ink)}
.tipcard .row{display:flex;gap:8px;flex-wrap:wrap}

/* week */
.wk{margin:0 0 20px}
.wk-head{display:flex;width:100%;justify-content:space-between;align-items:baseline;background:none;border:0;padding:4px 2px 8px;text-align:left}
.wk-name{font-size:19px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.wk-name b{font-weight:800}
.wk.today .wk-name::after{content:"Today";font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent);padding:2px 8px;border-radius:99px}
.wk-meta{font-size:13px;color:var(--muted)}
.wk-empty{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;border:1.5px dashed var(--line-strong);border-radius:14px;color:var(--muted);font-size:14px}
.wk-empty button{border:0;background:transparent;font-weight:600;font-size:14px;padding:6px 12px;border-radius:10px;color:var(--accent)}

/* tasks view */
.hint{margin:8px 2px 12px;color:var(--muted);font-size:14.5px}
.hint b{color:var(--ink);font-weight:700}
.hint.sm{margin:0 2px 4px;font-size:13.5px}
.tools{display:flex;gap:8px;margin-bottom:10px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 12px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.btn-new{flex:none;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:0 16px;font-weight:700;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--c);color:var(--on-c);border-color:transparent}
.chip.all.on{background:var(--ink);color:var(--bg)}
.grp{margin-top:14px}
.grp h3{margin:0 0 8px 2px;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.grp .ge{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:16px}
.grp .gc{font-size:13px;font-weight:600;color:var(--muted)}

/* home tab */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.hcard h3{margin:0 0 12px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.hcard p.sm{margin:0 0 12px;color:var(--muted);font-size:14px}
.sum{display:flex;gap:18px;align-items:center}
.ring{--p:0;flex:none;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center}
.ring-in{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.ring-in b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sum h3{margin:0 0 2px}
.sum p{margin:0;color:var(--muted);font-size:14px}
.brow{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
.brow:last-child{margin-bottom:0}
.brow .bn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bc{color:var(--muted);font-size:13px;min-width:34px;text-align:right}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:99px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0;padding-top:0}
.prow .pt{flex:1;min-width:0}
.prow .pt b{display:block;font-weight:600;font-size:15.5px}
.prow .pt span{font-size:13px;color:var(--muted)}
.prow .tile{width:36px;height:36px;font-size:18px;border-radius:11px}
.iconbtn{flex:none;border:0;background:transparent;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);padding:0}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.textbtn{flex:none;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--danger);padding:6px 8px;border-radius:10px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow .inp{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:9px 0;border-radius:9px;font-weight:600;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line-strong)}

/* bottom nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px 4px}
#nav button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--ink)}
#nav button[aria-current="page"] svg{stroke:var(--accent);stroke-width:2.2}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:25;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:14px;max-width:min(92vw,520px);font-size:14.5px;font-weight:500;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#toast button{flex:none;background:none;border:0;padding:2px 4px;font-weight:700;font-size:14.5px;color:var(--toast-btn)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40}
.sheet .backdrop{position:absolute;inset:0;background:rgba(10,14,24,.5);opacity:0;transition:opacity .2s}
.sheet.open .backdrop{opacity:1}
.panel{position:absolute;left:50%;bottom:0;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open .panel{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line-strong);margin:0 auto 12px}
.panel h2{margin:0 0 14px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sh-top{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.sh-top h2{margin:0;line-height:1.2}
.sh-top .inp{flex:1;min-width:0;font-weight:600}
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-size:14.5px;font-weight:600;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.cat.on{background:var(--c);color:var(--on-c);border-color:transparent}
.row2{display:flex;gap:10px}
.row2 .em{width:84px;flex:none}
.row2 .grow{flex:1;min-width:0}
.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px;font-weight:600;text-align:left;margin-bottom:16px}
.toggle .knob{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .15s}
.toggle .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"] .knob{background:var(--ok)}
.toggle[aria-checked="true"] .knob::after{transform:translateX(18px)}
.help{margin:-8px 2px 16px;color:var(--muted);font-size:13.5px}
.err{color:var(--danger);font-size:13.5px;margin:-8px 0 12px}
.actions{display:flex;gap:10px}
.actions .btn{flex:1;padding:13px}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header id="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <h1 id="range">Home week</h1>
        <p id="wk"></p>
      </div>
      <div class="wnav">
        <button data-act="prev" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button data-act="today">Today</button>
        <button data-act="next" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div id="strip" class="strip"></div>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1"></main>

<nav id="nav" aria-label="Sections">
  <div class="in">
    <button data-act="tab" data-tab="day"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Day</button>
    <button data-act="tab" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M9.2 9.5V20M14.8 9.5V20"/></svg>Week</button>
    <button data-act="tab" data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.8 6l1.2 1.2L7.2 5M3.8 12l1.2 1.2 2.2-2.2M3.8 18l1.2 1.2 2.2-2.2"/></svg>Tasks</button>
    <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>Home</button>
  </div>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" class="sheet" hidden></div>

<script>
(function(){
'use strict';

/* ---------- data ---------- */
const CATS=[
  {id:'cleaning',name:'Cleaning',emoji:'🧽',hue:210},
  {id:'dishes',name:'Dishes',emoji:'🍽️',hue:175},
  {id:'laundry',name:'Laundry',emoji:'👕',hue:268},

/* ---------- routines (weekly repeats) ---------- */
function makeRule(base,wd,start){
  return {id:uid(),tid:base.tid,name:base.name,emoji:base.emoji,cat:base.cat,min:base.min,time:base.time||'any',who:base.who||null,note:base.note||'',wd:wd,start:start,skip:[]};
}
function ensureWeek(){
  let changed=false;
  for(let i=0;i<7;i++){
    const k=keyOf(addDays(S.weekStart,i));
    S.repeats.forEach(function(r){
      if(r.wd!==i||k<r.start)return;
      if((r.skip||[]).indexOf(k)>=0)return;
      const arr=(S.plan[k]=S.plan[k]||[]);
      if(arr.some(x=>x.rid===r.id))return;
      arr.push({id:uid(),rid:r.id,tid:r.tid,name:r.name,emoji:r.emoji,cat:r.cat,min:r.min,time:r.time||'any',who:r.who||null,note:r.note||'',done:false});
      changed=true;
    });
  }
  if(changed)save();
}
function dropRule(rid,fromKey){
  S.repeats=S.repeats.filter(r=>r.id!==rid);
  Object.keys(S.plan).forEach(function(k){
    S.plan[k]=(S.plan[k]||[]).filter(function(t){
      if(t.rid!==rid)return true;
      if(!t.done&&k>=fromKey)return false;
      delete t.rid;return true;
    });
  });
}

/* ---------- swipe ---------- */
function attachSwipe(row,opts){
  const card=row.querySelector('.card');
  const TH=84;
  let sx=0,sy=0,dx=0,id=null,state=0;
  row.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(e.target.closest('button'))return;
    state=1;sx=e.clientX;sy=e.clientY;dx=0;id=e.pointerId;
  });
  row.addEventListener('pointermove',function(e){
    if(state===0||e.pointerId!==id)return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(state===1){
      if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)*1.3){
        state=2;try{row.setPointerCapture(id);}catch(_){}
        row.classList.add('dragging');
      }else if(Math.abs(my)>10){state=0;return;}
      else return;
    }
    dx=mx;
    const can=dx>0?!!opts.right:!!opts.left;
    card.style.transform='translateX('+(can?dx:dx*0.18)+'px)';
    row.dataset.dir=can?(dx>0?'r':'l'):'';
    row.classList.toggle('armed',can&&Math.abs(dx)>TH);
  });
  function end(cancelled){
    if(state!==2){state=0;return;}
    state=0;
    row._dragEnd=Date.now();
    row.classList.remove('dragging','armed');
    const fn=dx>0?opts.right:opts.left;
    const fire=!cancelled&&fn&&Math.abs(dx)>TH;
    if(fire&&dx<0){
      card.style.transform='translateX(-105%)';
      setTimeout(fn,170);
    }else{
      card.style.transform='';
      if(fire)fn();
      setTimeout(function(){if(state===0)row.dataset.dir='';},230);
    }
  }
  row.addEventListener('pointerup',function(){end(false);});
  row.addEventListener('pointercancel',function(){end(true);});
}
function bindSwipes(root){
  $$('.swipe',root).forEach(function(row){
    if(row.classList.contains('plan')){
      attachSwipe(row,{
        right:function(){toggleDone(row.dataset.key,row.dataset.id);},
        left:function(){removePlanned(row.dataset.key,row.dataset.id);}
      });
    }else{
      attachSwipe(row,{
        right:function(){addToDay(row.dataset.tid,S.sel);},
        left:row.dataset.custom?function(){deleteCustom(row.dataset.tid);}:null
      });
    }
  });
}

/* ---------- actions ---------- */
function toggleDone(key,id){
  const t=(S.plan[key]||[]).find(x=>x.id===id);
  if(!t)return;
  t.done=!t.done;save();renderAll();
}
function removePlanned(key,id){
  const arr=S.plan[key]||[];
  const i=arr.findIndex(x=>x.id===id);
  if(i<0)return;
  const before=snap();
  const t=arr.splice(i,1)[0];
  if(t.rid){
    const r=S.repeats.find(x=>x.id===t.rid);
    if(r){r.skip=r.skip||[];r.skip.push(key);}
  }
  save();renderAll();
  toast('Removed “'+t.name+'”','Undo',function(){restore(before);});
}
function addToDay(tid,key){
  const t=taskById(tid);
  if(!t)return;
  const before=snap();
  const item={id:uid(),tid:t.id,name:t.name,emoji:t.emoji,cat:t.cat,min:t.min,time:DEF[t.name]||'any',who:S.addWho||null,note:'',done:false};
  (S.plan[key]=S.plan[key]||[]).push(item);
  save();renderStrip();refreshBadges();
  toast(t.name+' added to '+dow(key),'Undo',function(){restore(before);});
}
function deleteCustom(tid){
  const i=S.custom.findIndex(x=>x.id===tid);
  if(i<0)return;
  const t=S.custom.splice(i,1)[0];
  save();renderTaskList();
  toast('Deleted “'+t.name+'”','Undo',function(){
    S.custom.splice(Math.min(i,S.custom.length),0,t);
    save();renderTaskList();
  });
}
function clearDay(){
  const arr=S.plan[S.sel]||[];
  if(!arr.length)return;
  const before=snap();
  arr.forEach(function(t){
    if(t.rid){const r=S.repeats.find(x=>x.id===t.rid);if(r){r.skip=r.skip||[];r.skip.push(S.sel);}}
  });
  S.plan[S.sel]=[];
  save();renderAll();
  toast('Cleared '+dow(S.sel),'Undo',function(){restore(before);});
}
function copyWeek(){
  const before=snap();let n=0;
  for(let i=0;i<7;i++){
    const k=keyOf(addDays(S.weekStart,i)),nk=keyOf(addDays(S.weekStart,i+7));
    (S.plan[k]||[]).forEach(function(t){
      if(t.rid)return;
      const c=JSON.parse(JSON.stringify(t));
      c.id=uid();c.done=false;
      (S.plan[nk]=S.plan[nk]||[]).push(c);n++;
    });
  }
  save();renderAll();
  if(n)toast('Copied '+n+(n===1?' task':' tasks')+' to next week','Undo',function(){restore(before);});
  else toast('Nothing to copy. Weekly routines repeat by themselves.');
}
function addStarter(){
  const before=snap();
  const cur=keyOf(mondayOf(new Date()))===keyOf(S.weekStart);
  const start=cur?todayKey():keyOf(S.weekStart);
  let n=0;
  STARTER.forEach(function(row){
    const t=BUILTIN.find(x=>x.name===row[0]);
    if(!t)return;
    row[2].forEach(function(wd){
      if(S.repeats.some(r=>r.tid===t.id&&r.wd===wd))return;
      S.repeats.push(makeRule({tid:t.id,name:t.name,emoji:t.emoji,cat:t.cat,min:t.min,time:row[1]},wd,start));n++;
    });
  });
  S.tip=true;save();renderAll();
  if(n)toast('Starter routine added','Undo',function(){restore(before);});
  else toast('The starter routine is already in your routines.');
}

  save();renderAll();return true;

function removePerson(id){

  if(S.who===id)S.who='all';

  if(label)t.querySelector('button').onclick=function(){fn();t.classList.remove('show');};

      +'<span class="dn">'+F_SHORT.format(d)+'</span><span class="dd">'+d.getDate()+'</span><span class="dots">'+dots+'</span></button>';

function renderAll(){

function whoBar(){
  if(!S.people.length)return '';
  return '<div class="chips whobar" id="whobar"><button class="chip all'+(S.who==='all'?' on':'')+'" type="button" data-act="whof" data-w="all">Everyone</button>'
    +S.people.map(p=>'<button class="chip cat'+(S.who===p.id?' on':'')+'" type="button" data-act="whof" data-w="'+p.id+'" style="--h:'+p.hue+'">'+esc(p.name)+'</button>').join('')+'</div>';
}

/* ---------- render: day ---------- */
function renderDay(){
  const main=$('#main');
  const all=S.plan[S.sel]||[];
  const list=sortTimes(all.filter(vis));
  const done=list.filter(t=>t.done).length;
  const mins=list.reduce((a,t)=>a+t.min,0);
  const pct=list.length?Math.round(done/list.length*100):0;
  let html='';
  if(!S.tip&&!all.length&&!S.repeats.length){
    html+='<div class="tipcard"><h3>Welcome to Home Week</h3><ul>'
      +'<li><b>Tasks tab:</b> swipe a task right to plan it on the day you picked.</li>'
      +'<li><b>Tap any task</b> to choose days, a time of day, who does it, or repeat it every week.</li>'
      +'<li><b>Day tab:</b> swipe right when it is done, left to remove it.</li></ul>'
      +'<div class="row"><button class="btn primary" type="button" data-act="starter">Add a starter routine</button><button class="btn" type="button" data-act="tipdone">Start from scratch</button></div></div>';
  }
  html+=whoBar();
  html+='<section class="dayhead"><h2>'+esc(longLabel(S.sel))+'</h2><p>'
    +(list.length?done+' of '+list.length+' done, '+fmtMin(mins)+' planned':(all.length?'Nothing here for this person':'Nothing planned yet'))+'</p>'
    +(list.length?'<div class="prog" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>':'')
    +'</section>';
  if(list.length){
    const groups=TIMES.map(function(tm){return {tm:tm,items:list.filter(t=>(t.time||'any')===tm[0])};}).filter(g=>g.items.length);
    const flat=groups.length===1&&groups[0].tm[0]==='any';
    html+=groups.map(function(g){
      return (flat?'':'<h3 class="tgrp">'+g.tm[2]+' '+g.tm[1]+'</h3>')
        +'<div class="list">'+g.items.map(t=>planRow(t,S.sel)).join('')+'</div>';
    }).join('');
    html+='<p class="tip">Swipe right to finish a task, left to remove it. Tap a task to edit it.</p>'
      +'<button class="addmore" type="button" data-act="tab" data-tab="tasks">Add more tasks</button>'
      +'<div style="text-align:center"><button class="linkbtn" type="button" data-act="clearday">Clear this day</button></div>';
  }else if(!all.length){
    html+='<div class="empty"><div class="big">🗓️</div><h3>This day is open</h3>'
      +'<p>Pick tasks in the Tasks tab and swipe them right to plan this day.</p>'
      +'<button class="btn primary" type="button" data-act="tab" data-tab="tasks">Browse tasks</button>'
      +(S.repeats.length?'':'<div><button class="linkbtn" type="button" data-act="starter">Or add a starter routine</button></div>')
      +'</div>';
  }
  main.innerHTML=html;
  bindSwipes(main);
}

/* ---------- render: week ---------- */
function renderWeek(){
  const main=$('#main');
  let html=whoBar();
  for(let i=0;i<7;i++){
    const d=addDays(S.weekStart,i),k=keyOf(d);
    const list=sortTimes((S.plan[k]||[]).filter(vis));
    const mins=list.reduce((a,t)=>a+t.min,0);
    html+='<section class="wk'+(k===todayKey()?' today':'')+'">'
      +'<button class="wk-head" type="button" data-act="openday" data-key="'+k+'">'
      +'<span class="wk-name">'+F_SHORT.format(d)+' <b>'+d.getDate()+'</b></span>'
      +'<span class="wk-meta">'+(list.length?list.length+(list.length===1?' task, ':' tasks, ')+fmtMin(mins):'No tasks')+'</span></button>';
    if(list.length)html+='<div class="list">'+list.map(t=>planRow(t,k,true)).join('')+'</div>';
    else html+='<div class="wk-empty"><span>Free day</span><button type="button" data-act="planday" data-key="'+k+'">Add tasks</button></div>';
    html+='</section>';
  }
  main.innerHTML=html;
  bindSwipes(main);
}

/* ---------- render: tasks ---------- */
function libRow(t){
  const c=catOf(t.cat);
  return '<div class="swipe lib cat" data-tid="'+t.id+'"'+(t.custom?' data-custom="1"':'')+' style="--h:'+c.hue+'">'
    +'<div class="bg"><span class="bg-r">Add</span><span class="bg-l">Delete</span></div>'
    +'<div class="card">'
    +'<span class="tile">'+esc(t.emoji)+'</span>'
    +'<div class="txt"><div class="nm">'+esc(t.name)+'</div><div class="sub"><span>'+fmtMin(t.min)+'</span></div></div>'
    +'<span class="planned" hidden></span>'
    +'<button class="addbtn" type="button" data-act="add" aria-label="Add '+esc(t.name)+' to the selected day">'+ICON_PLUS+'</button>'
    +'</div></div>';
}
function assignBar(){
  if(!S.people.length)return '';
  return '<p class="hint sm">Assign new tasks to</p><div class="chips" id="assignbar">'
    +'<button class="chip all'+(!S.addWho?' on':'')+'" type="button" data-act="assignto" data-w="">Nobody</button>'
    +S.people.map(p=>'<button class="chip cat'+(S.addWho===p.id?' on':'')+'" type="button" data-act="assignto" data-w="'+p.id+'" style="--h:'+p.hue+'">'+esc(p.name)+'</button>').join('')+'</div>';
}
function renderTasks(){
  const main=$('#main');
  const chips='<button class="chip all'+(S.filter==='all'?' on':'')+'" type="button" data-act="filter" data-f="all">All</button>'
    +allCats().map(c=>'<button class="chip cat'+(S.filter===c.id?' on':'')+'" type="button" data-act="filter" data-f="'+c.id+'" style="--h:'+c.hue+'"><span>'+esc(c.emoji)+'</span>'+esc(c.name)+'</button>').join('');
  main.innerHTML='<p class="hint" id="hint"></p>'
    +assignBar()
    +'<div class="tools"><div class="search">'+ICON_SEARCH+'<input id="q" type="search" placeholder="Search '+allTasks().length+' tasks" value="'+esc(S.q)+'" autocomplete="off" enterkeyhint="search" aria-label="Search tasks"></div>'
    +'<button class="btn-new" type="button" data-act="newtask">New task</button></div>'

function updateHint(){
  const h=$('#hint');
  if(h)h.innerHTML='Swipe a task right to add it to <b>'+esc(midLabel(S.sel))+'</b>. Tap a task to pick days, time or repeat.';
}
function renderTaskList(){
  const el=$('#tasklist');
  if(!el)return;
  const q=S.q.trim().toLowerCase();
  const groups=allCats().filter(c=>S.filter==='all'||c.id===S.filter).map(c=>({
    c:c,items:allTasks().filter(t=>t.cat===c.id&&(!q||t.name.toLowerCase().indexOf(q)>=0))
  })).filter(g=>g.items.length);
  if(!groups.length){
    el.innerHTML=q
      ?'<div class="empty small"><p>No task matches “'+esc(S.q.trim())+'”.</p><button class="btn primary" type="button" data-act="newtask" data-name="'+esc(S.q.trim())+'">Create this task</button></div>'
      :'<div class="empty small"><p>No tasks in this branch yet.</p><button class="btn primary" type="button" data-act="newtask" data-cat="'+esc(S.filter)+'">New task</button></div>';
    return;
  }
  el.innerHTML=groups.map(g=>'<section class="grp cat" style="--h:'+g.c.hue+'"><h3><span class="ge">'+esc(g.c.emoji)+'</span>'+esc(g.c.name)+'<span class="gc">'+g.items.length+'</span></h3><div class="list">'+g.items.map(libRow).join('')+'</div></section>').join('');
  bindSwipes(el);refreshBadges();
}
function refreshBadges(){
  if(S.tab!=='tasks')return;
  const counts={};
  (S.plan[S.sel]||[]).forEach(p=>{counts[p.tid]=(counts[p.tid]||0)+1;});
  const d=dow(S.sel);
  $$('.swipe.lib').forEach(function(r){
    const n=counts[r.dataset.tid]||0;
    const b=r.querySelector('.planned');
    b.hidden=!n;
    b.textContent='On '+d+(n>1?' ×'+n:'');
    r.querySelector('.bg-r').textContent='Add to '+d;
  });
}

/* ---------- render: home ---------- */
let HOME_GROUPS=[];
function renderHome(){
  const main=$('#main');
  const items=[];
  for(let i=0;i<7;i++){(S.plan[keyOf(addDays(S.weekStart,i))]||[]).forEach(t=>items.push(t));}
  const total=items.length,done=items.filter(t=>t.done).length;
  const pct=total?Math.round(done/total*100):0;
  const tm=items.reduce((a,t)=>a+t.min,0),dm=items.filter(t=>t.done).reduce((a,t)=>a+t.min,0);
  let html='<div class="hcard"><div class="sum"><div class="ring" style="--p:'+pct+'"><div class="ring-in"><b>'+pct+'%</b></div></div>'
    +'<div><h3>'+(total?done+' of '+total+' done':'Nothing planned')+'</h3><p>'
    +(total?fmtMin(dm)+' finished of '+fmtMin(tm)+' this week':'Plan some tasks to see your week take shape.')+'</p></div></div></div>';

  const byCat={};
  items.forEach(function(t){const o=byCat[t.cat]=byCat[t.cat]||{n:0,d:0};o.n++;if(t.done)o.d++;});
  const catRows=allCats().filter(c=>byCat[c.id]);
  if(catRows.length){
    html+='<div class="hcard"><h3>This week by branch</h3>'
      +catRows.map(function(c){
        const o=byCat[c.id];
        return '<div class="brow cat" style="--h:'+c.hue+'"><span class="bn">'+esc(c.emoji)+' '+esc(c.name)+'</span><div class="track"><i style="width:'+Math.round(o.d/o.n*100)+'%"></i></div><span class="bc">'+o.d+'/'+o.n+'</span></div>';
      }).join('')+'</div>';
  }

  html+='<div class="hcard"><h3>People</h3>';
  if(S.people.length){
    const un=items.filter(t=>!t.who);
    html+=S.people.map(function(p){
      const mine=items.filter(t=>t.who===p.id);
      const mm=mine.reduce((a,t)=>a+t.min,0);
      return '<div class="prow"><span class="av cat" style="--h:'+p.hue+'">'+esc(ini(p.name))+'</span><div class="pt"><b>'+esc(p.name)+'</b><span>'+(mine.length?mine.length+(mine.length===1?' task, ':' tasks, ')+fmtMin(mm)+' this week':'No tasks this week')+'</span></div>'
        +'<button class="iconbtn" type="button" data-act="delperson" data-id="'+p.id+'" aria-label="Remove '+esc(p.name)+'">'+ICON_X+'</button></div>';
    }).join('');
    if(un.length)html+='<p class="sm" style="margin:8px 0 0;color:var(--muted);font-size:13.5px">'+un.length+(un.length===1?' task':' tasks')+' not assigned to anyone.</p>';
  }else{
    html+='<p class="sm">Add the people you share the house with, then give each task an owner.</p>';
  }
  html+='<div class="addrow"><input class="inp" id="p-name" type="text" maxlength="20" placeholder="Name" autocomplete="off"><button class="btn primary" type="button" data-act="addperson">Add</button></div></div>';

  const g={};
  S.repeats.forEach(function(r){
    const k=r.tid+'|'+r.name;
    (g[k]=g[k]||{r:r,wds:[]}).wds.push(r.wd);
  });
  HOME_GROUPS=Object.keys(g).map(k=>g[k]);
  html+='<div class="hcard"><h3>Weekly routines</h3>';
  if(HOME_GROUPS.length){
    html+=HOME_GROUPS.map(function(gr,i){
      const c=catOf(gr.r.cat);
      const wds=gr.wds.slice().sort((a,b)=>a-b);
      const label=wds.length===7?'Every day':wds.map(x=>WD[x]).join(', ');
      return '<div class="prow cat" style="--h:'+c.hue+'"><span class="tile">'+esc(gr.r.emoji)+'</span><div class="pt"><b>'+esc(gr.r.name)+'</b><span>'+label+'</span></div>'
        +'<button class="textbtn" type="button" data-act="stoprule" data-gi="'+i+'">Stop</button></div>';
    }).join('');
    html+='<p class="sm" style="margin:10px 0 0;color:var(--muted);font-size:13.5px">Routines fill in every week on their own. Tap any task to make it repeat.</p>';
  }else{
    html+='<p class="sm">Tasks you repeat show up here. Try a ready-made set to begin.</p>'
      +'<button class="btn wide" type="button" data-act="starter">Add a starter routine</button>';
  }
  html+='</div>';

  html+='<div class="hcard"><h3>Week tools</h3><div class="stack">'
    +'<button class="btn wide" type="button" data-act="copyweek">Copy this week to next week</button>'
    +'</div></div>';

  html+='<div class="hcard"><h3>Appearance</h3><div class="seg" role="group" aria-label="Theme">'
    +['auto','light','dark'].map(x=>'<button type="button" data-act="theme" data-th="'+x+'" aria-pressed="'+(S.theme===x)+'">'+x.charAt(0).toUpperCase()+x.slice(1)+'</button>').join('')
    +'</div></div>';

  html+='<div class="hcard"><h3>Your data</h3><p class="sm">Everything is saved on this device only.</p>'
    +'<button class="btn danger wide" type="button" data-act="reset">Erase all my data</button></div>';
  main.innerHTML=html;
}

/* ---------- sheets ---------- */
let CUR=null,FM=null,TS=null;
function openSheetWith(fn){
  CUR=fn;fn();
  const sh=$('#sheet');
  sh.hidden=false;
  requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add('open');});});
}
function redraw(focusId){
  if(!CUR)return;
  const p=$('#sheet .panel'),st=p?p.scrollTop:0;
  CUR(focusId);
  const q=$('#sheet .panel');
  if(q)q.scrollTop=st;
}
function closeSheet(){
  const sh=$('#sheet');
  sh.classList.remove('open');
  CUR=null;FM=null;TS=null;
  setTimeout(function(){if(!CUR){sh.hidden=true;sh.innerHTML='';}},260);
}
function minChips(cur){
  return [5,10,15,20,30,45,60,90].map(m=>'<button type="button" class="opt'+(cur===m?' on':'')+'" data-act="'+(TS?'tmin':'fmin')+'" data-m="'+m+'">'+fmtMin(m)+'</button>').join('');
}

function saveNewTask(){
  const name=FM.name.trim();
  if(!name){FM.err='Give the task a name.';redraw('f-name');return;}
  let cat=FM.cat;
  if(FM.nb){
    const bn=FM.bname.trim();
    if(!bn){FM.err='Name the new branch.';redraw('f-bname');return;}
    cat='x'+uid();
    S.customCats.push({id:cat,name:bn,emoji:(FM.bemoji||'📌').trim()||'📌',hue:EXTRA_HUES[S.customCats.length%EXTRA_HUES.length]});
    S.filter=cat;
  }
  const t={id:'u'+uid(),cat:cat,name:name,emoji:catOf(cat).emoji,min:FM.min,custom:true};
  S.custom.push(t);
  const also=FM.also;
  if(also)(S.plan[S.sel]=S.plan[S.sel]||[]).push({id:uid(),tid:t.id,name:t.name,emoji:t.emoji,cat:t.cat,min:t.min,time:'any',who:S.addWho||null,note:'',done:false});
  save();closeSheet();renderAll();
  toast(also?'Saved and added to '+dow(S.sel):'Task saved');
}

/* plan / edit a task */
function openTaskSheet(o){
  if(o.mode==='add'){
    const t=taskById(o.tid);
    if(!t)return;
    TS={mode:'add',tid:t.id,name:t.name,emoji:t.emoji,cat:t.cat,min:t.min,days:[S.sel],time:DEF[t.name]||'any',who:S.addWho||null,note:'',repeat:false,hadRule:false,err:''};
  }else{
    const it=(S.plan[o.key]||[]).find(x=>x.id===o.id);
    if(!it)return;
    const rule=it.rid?S.repeats.find(r=>r.id===it.rid):null;
    TS={mode:'edit',key:o.key,id:it.id,tid:it.tid,name:it.name,emoji:it.emoji,cat:it.cat,min:it.min,days:[o.key],time:it.time||'any',who:it.who||null,note:it.note||'',repeat:!!rule,hadRule:!!rule,err:''};
  }
  openSheetWith(renderTaskSheet);
}
function renderTaskSheet(focusId){
  const T=TS,multi=T.mode==='add',c=catOf(T.cat);
  let days='';
  for(let i=0;i<7;i++){
    const k=keyOf(addDays(S.weekStart,i)),on=T.days.indexOf(k)>=0;
    days+='<button type="button" class="opt'+(on?' on':'')+'" data-act="tday" data-k="'+k+'" aria-pressed="'+on+'">'+F_SHORT.format(fromKey(k))+' '+fromKey(k).getDate()+'</button>';
  }
  const when=TIMES.slice().sort((a,b)=>(a[0]==='any'?-1:0)-(b[0]==='any'?-1:0)).map(x=>'<button type="button" class="opt'+(T.time===x[0]?' on':'')+'" data-act="ttime" data-t="'+x[0]+'">'+x[2]+' '+x[1]+'</button>').join('');
  const who=S.people.length
    ?'<div class="fld"><span>Who does it</span><div class="opts"><button type="button" class="opt'+(!T.who?' on':'')+'" data-act="twho" data-w="">Nobody</button>'
      +S.people.map(p=>'<button type="button" class="opt cat'+(T.who===p.id?' on':'')+'" data-act="twho" data-w="'+p.id+'" style="--h:'+p.hue+'">'+esc(p.name)+'</button>').join('')+'</div></div>'
    :'';
  const sh=$('#sheet');
  sh.innerHTML='<div class="backdrop" data-act="closesheet"></div>'
  +'<div class="panel" role="dialog" aria-modal="true" aria-label="'+(multi?'Plan task':'Edit task')+'">'
  +'<div class="grab"></div>'
  +'<div class="sh-top"><span class="tile cat" style="--h:'+c.hue+'">'+esc(T.emoji)+'</span>'
  +(multi?'<h2>'+esc(T.name)+'</h2>':'<input class="inp" id="t-name" type="text" maxlength="60" aria-label="Task name" value="'+esc(T.name)+'">')+'</div>'
  +'<div class="fld"><span>'+(multi?'Days (pick one or more)':'Day')+'</span><div class="opts">'+days+'</div></div>'
  +'<div class="fld"><span>When</span><div class="opts">'+when+'</div></div>'
  +who
  +'<div class="fld"><span>Time needed</span><div class="opts">'+minChips(T.min)+'</div></div>'
  +'<label class="fld"><span>Note</span><input class="inp" id="t-note" type="text" maxlength="80" placeholder="Optional" autocomplete="off" value="'+esc(T.note)+'"></label>'
  +'<button type="button" class="toggle" role="switch" aria-checked="'+T.repeat+'" data-act="trep"><span>Repeat every week'+(multi&&T.days.length>1?' on these days':'')+'</span><i class="knob"></i></button>'
  +(T.hadRule?'<p class="help">Turn this off to stop repeating from this day on.</p>':'')
  +(T.err?'<p class="err">'+esc(T.err)+'</p>':'')
  +'<div class="actions">'
  +(multi?'<button type="button" class="btn ghost" data-act="closesheet">Cancel</button><button type="button" class="btn primary" data-act="tsave">Add to '+T.days.length+(T.days.length===1?' day':' days')+'</button>'
         :'<button type="button" class="btn danger" data-act="tdelete">Delete</button><button type="button" class="btn primary" data-act="tsave">Save</button>')
  +'</div></div>';
  if(focusId){const i=$('#'+focusId);if(i)i.focus();}
}
function saveTaskSheet(){
  const T=TS;
  if(T.mode==='add'){
    if(!T.days.length){T.err='Pick at least one day.';redraw();return;}
    const note=T.note.trim();
    T.days.slice().sort().forEach(function(k){
      const item={id:uid(),tid:T.tid,name:T.name,emoji:T.emoji,cat:T.cat,min:T.min,time:T.time,who:T.who,note:note,done:false};
      if(T.repeat){
        const r=makeRule({tid:T.tid,name:T.name,emoji:T.emoji,cat:T.cat,min:T.min,time:T.time,who:T.who,note:note},wdOf(k),k);
        S.repeats.push(r);item.rid=r.id;
      }
      (S.plan[k]=S.plan[k]||[]).push(item);
    });
    const n=T.days.length,rep=T.repeat;
    save();closeSheet();renderAll();
    toast('Added to '+n+(n===1?' day':' days')+(rep?', repeating weekly':''));
    return;
  }
  const arr=S.plan[T.key]||[];
  const it=arr.find(x=>x.id===T.id);
  if(!it){closeSheet();return;}
  const name=T.name.trim();
  if(!name){T.err='Give the task a name.';redraw('t-name');return;}
  it.name=name;it.min=T.min;it.time=T.time;it.who=T.who;it.note=T.note.trim();
  let rule=it.rid?S.repeats.find(r=>r.id===it.rid):null;
  if(rule&&!T.repeat){
    delete it.rid;dropRule(rule.id,T.key);rule=null;
  }else if(rule){
    rule.name=name;rule.min=T.min;rule.time=T.time;rule.who=T.who;rule.note=it.note;
  }
  const newKey=T.days[0]||T.key;
  let fk=T.key;
  if(newKey!==T.key){
    if(it.rid){
      const cr=S.repeats.find(r=>r.id===it.rid);
      if(cr){cr.skip=cr.skip||[];cr.skip.push(T.key);}
      delete it.rid;
    }
    const src=S.plan[T.key]||[];
    const idx=src.indexOf(it);
    if(idx>=0)src.splice(idx,1);
    (S.plan[newKey]=S.plan[newKey]||[]).push(it);
    fk=newKey;
  }
  if(!rule&&!T.hadRule&&T.repeat){
    const r=makeRule({tid:it.tid,name:it.name,emoji:it.emoji,cat:it.cat,min:it.min,time:it.time,who:it.who,note:it.note},wdOf(fk),fk);
    S.repeats.push(r);it.rid=r.id;
  }
  save();closeSheet();renderAll();
  toast(newKey!==T.key?'Moved to '+dow(newKey):'Task updated');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');
  if(!b){
    const row=e.target.closest('.swipe');
    if(row&&!e.target.closest('.sheet')){
      if(row._dragEnd&&Date.now()-row._dragEnd<350)return;
      if(row.classList.contains('plan'))openTaskSheet({mode:'edit',key:row.dataset.key,id:row.dataset.id});
      else openTaskSheet({mode:'add',tid:row.dataset.tid});
    }
    return;
  }
  const a=b.dataset.act;
  if(a==='tab')setTab(b.dataset.tab);
  else if(a==='sel')selectDay(b.dataset.key);
  else if(a==='prev')shiftWeek(-7);
  else if(a==='next')shiftWeek(7);
  else if(a==='today')goToday();
  else if(a==='check'){const r=b.closest('.swipe');toggleDone(r.dataset.key,r.dataset.id);}
  else if(a==='add'){const r=b.closest('.swipe');addToDay(r.dataset.tid,S.sel);}
  else if(a==='filter'){
    S.filter=b.dataset.f;
    $$('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.f===S.filter));
    renderTaskList();
  }
  else if(a==='whof'){S.who=b.dataset.w;if(S.tab==='week')renderWeek();else renderDay();}
  else if(a==='assignto'){
    S.addWho=b.dataset.w;
    $$('#assignbar .chip').forEach(c=>c.classList.toggle('on',c.dataset.w===S.addWho));
  }
  else if(a==='openday'){S.sel=b.dataset.key;S.tab='day';renderAll();window.scrollTo(0,0);}
  else if(a==='planday'){S.sel=b.dataset.key;S.tab='tasks';renderAll();window.scrollTo(0,0);}
  else if(a==='clearday')clearDay();
  else if(a==='starter')addStarter();
  else if(a==='tipdone'){S.tip=true;save();renderDay();}
  else if(a==='copyweek')copyWeek();
  else if(a==='addperson'){
    const i=$('#p-name');
    if(i&&addPerson(i.value)){const n=$('#p-name');if(n)n.focus();}
    else if(i)i.focus();
  }
  else if(a==='delperson')removePerson(b.dataset.id);
  else if(a==='stoprule'){
    const gr=HOME_GROUPS[Number(b.dataset.gi)];
    if(gr){
      const before=snap();
      S.repeats.filter(r=>r.tid===gr.r.tid&&r.name===gr.r.name).map(r=>r.id).forEach(id=>dropRule(id,todayKey()));
      save();renderAll();
      toast('Stopped “'+gr.r.name+'”','Undo',function(){restore(before);});
    }
  }
  else if(a==='theme'){S.theme=b.dataset.th;applyTheme();save();renderHome();}
  else if(a==='reset'){
    b.dataset.act='reset2';b.textContent='Tap again to erase everything';
    setTimeout(function(){if(b.isConnected&&b.dataset.act==='reset2'){b.dataset.act='reset';b.textContent='Erase all my data';}},4000);
  }
  else if(a==='reset2'){
    try{localStorage.removeItem(STORE);}catch(_){}
    S.plan={};S.custom=[];S.customCats=[];S.repeats=[];S.people=[];S.theme='auto';S.tip=false;S.who='all';S.addWho='';S.filter='all';S.q='';
    applyTheme();S.tab='day';renderAll();window.scrollTo(0,0);
    toast('All data erased');
  }
  else if(a==='newtask')openNewTask({name:b.dataset.name,cat:b.dataset.cat});
  else if(a==='closesheet')closeSheet();
  else if(a==='fcat'){FM.cat=b.dataset.c;FM.nb=false;FM.err='';redraw();}
  else if(a==='fnb'){FM.nb=!FM.nb;FM.err='';redraw(FM.nb?'f-bname':null);}
  else if(a==='fmin'){FM.min=Number(b.dataset.m);redraw();}
  else if(a==='falso'){FM.also=!FM.also;redraw();}
  else if(a==='savetask')saveNewTask();
  else if(a==='tday'){
    const k=b.dataset.k;
    if(TS.mode==='add'){
      const i=TS.days.indexOf(k);
      if(i>=0)TS.days.splice(i,1);else TS.days.push(k);
    }else TS.days=[k];
    TS.err='';redraw();
  }
  else if(a==='ttime'){TS.time=b.dataset.t;redraw();}
  else if(a==='twho'){TS.who=b.dataset.w||null;redraw();}
  else if(a==='tmin'){TS.min=Number(b.dataset.m);redraw();}
  else if(a==='trep'){TS.repeat=!TS.repeat;redraw();}
  else if(a==='tsave')saveTaskSheet();
  else if(a==='tdelete'){
    const k=TS.key,id=TS.id;
    closeSheet();removePlanned(k,id);
  }
});
document.addEventListener('input',function(e){
  const id=e.target.id;
  if(id==='q'){S.q=e.target.value;renderTaskList();}
  else if(FM&&id==='f-name'){FM.name=e.target.value;FM.err='';}
  else if(FM&&id==='f-bname'){FM.bname=e.target.value;FM.err='';}
  else if(FM&&id==='f-bemoji'){FM.bemoji=e.target.value;}
  else if(TS&&id==='t-name'){TS.name=e.target.value;TS.err='';}
  else if(TS&&id==='t-note'){TS.note=e.target.value;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&CUR)closeSheet();
  if(e.key==='Enter'){
    const id=e.target.id;
    if(FM&&(id==='f-name'||id==='f-bname')){e.preventDefault();saveNewTask();}
    else if(TS&&(id==='t-name'||id==='t-note')){e.preventDefault();saveTaskSheet();}
    else if(id==='p-name'){e.preventDefault();const i=$('#p-name');if(addPerson(i.value)){const n=$('#p-name');if(n)n.focus();}}
  }
});
let lastToday=todayKey();
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&todayKey()!==lastToday){lastToday=todayKey();goToday();}
});

/* ---------- start ---------- */
applyTheme();
const now=new Date();
S.weekStart=mondayOf(now);
S.sel=keyOf(now);
renderAll();
})();
</script>
