<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Huisweek</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Huisweek">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A//www.w3.org/2000/svg'%20viewBox%3D'0%200%201024%201024'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%3E%3Cstop%20offset%3D'0'%20stop-color%3D'%234C66FF'/%3E%3Cstop%20offset%3D'1'%20stop-color%3D'%232233CC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D'1024'%20height%3D'1024'%20rx%3D'232'%20fill%3D'url(%23g)'/%3E%3Cpath%20d%3D'M512%20206%20L846%20484%20V822%20H178%20V484%20Z'%20fill%3D'%23fff'%20stroke%3D'%23fff'%20stroke-width%3D'48'%20stroke-linejoin%3D'round'/%3E%3Cpath%20d%3D'M368%20552%20L476%20660%20L664%20458'%20fill%3D'none'%20stroke%3D'%231FA267'%20stroke-width%3D'70'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --ink:#151A27; --muted:#667085; --line:#E1E5EC; --line-strong:#C9CFDA;
  --accent:#2F4BF0; --on-accent:#FFFFFF; --ok:#1F9D63; --danger:#D9433B;
  --toast-btn:#9DB0FF;
  --c-s:62%; --c-l:44%; --soft-s:75%; --soft-l:93%; --on-c:#FFFFFF;
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117; --surface:#171B24; --ink:#EDF0F6; --muted:#98A1B3; --line:#252B37; --line-strong:#3A4252;
    --accent:#8DA1FF; --on-accent:#0E1117; --ok:#3CC885; --danger:#F07168;
    --toast-btn:#2F4BF0;
    --c-s:75%; --c-l:68%; --soft-s:38%; --soft-l:21%; --on-c:#0E1117;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#171B24; --ink:#EDF0F6; --muted:#98A1B3; --line:#252B37; --line-strong:#3A4252;
  --accent:#8DA1FF; --on-accent:#0E1117; --ok:#3CC885; --danger:#F07168;
  --toast-btn:#2F4BF0;
  --c-s:75%; --c-l:68%; --soft-s:38%; --soft-l:21%; --on-c:#0E1117;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

.cat{--c:hsl(var(--h) var(--c-s) var(--c-l));--soft:hsl(var(--h) var(--soft-s) var(--soft-l))}

/* header */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:12px 0 10px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:12px}
#top.compact-top .top-row{margin-bottom:0}
h1{margin:0;font-size:27px;line-height:1.05;font-weight:800;letter-spacing:-.025em;font-variation-settings:"opsz" 72;white-space:nowrap}
#wk{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.wnav{display:flex;gap:6px;flex:none}
.wnav button{height:36px;min-width:36px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:grid;place-items:center}
.wnav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.day .dn{font-size:12px;font-weight:600;color:var(--muted)}
.day .dd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700}
.day .dots{display:flex;gap:3px;height:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) var(--c-s) var(--c-l))}
.dot.done{opacity:.3}
.day.today .dd{background:var(--accent);color:var(--on-accent)}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel .dn{color:inherit;opacity:.7}

/* main */
main.wrap{padding-top:6px;padding-bottom:120px;outline:none}
.dayhead h2{margin:8px 0 2px;font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.greet{margin:10px 0 0;color:var(--accent);font-weight:700;font-size:14.5px}
.greet + h2{margin-top:2px}
.dayhead p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.dayhead p.greet{margin:10px 0 0;color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pill{font-size:13.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s ease}
.list{display:flex;flex-direction:column;gap:8px}
.tip{margin:12px 2px 0;color:var(--muted);font-size:13.5px}
.tgrp{margin:16px 0 8px 2px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.tgrp:first-of-type{margin-top:6px}

.enter .swipe{animation:rowIn .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 30ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* swipe rows */
.swipe{position:relative;border-radius:16px;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.swipe .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:var(--on-bg,#fff);font-weight:700;font-size:15px}
.swipe[data-dir="r"] .bg{background:var(--rbg,var(--ok))}
.swipe[data-dir="l"] .bg{background:var(--danger);color:#fff}
.swipe .bg span{opacity:0;transition:transform .15s}
.swipe[data-dir="r"] .bg-r{opacity:1}
.swipe[data-dir="l"] .bg-l{opacity:1}
.swipe.armed .bg span{transform:scale(1.12)}
.swipe.lib{--rbg:var(--c);--on-bg:var(--on-c)}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:transform .22s cubic-bezier(.2,.8,.2,1);will-change:transform}
.swipe.dragging .card{transition:none}
.tile{flex:none;width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:21px}
.txt{flex:1;min-width:0}
.nm{font-weight:600;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13px;color:var(--muted);margin-top:1px}
.sub .cn{color:var(--c);font-weight:600}
.rep{display:inline-flex;align-items:center}
.rep svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.isdone .nm{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.card.isdone .tile{opacity:.5}
.av{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-size:12px;font-weight:700}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"] svg{opacity:1}
.check.pop{animation:popCheck .42s cubic-bezier(.2,.9,.3,1.4)}
@keyframes popCheck{0%{transform:scale(.6)}60%{transform:scale(1.28)}100%{transform:scale(1)}}
.addbtn{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--c);display:grid;place-items:center;padding:0}
.addbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.planned{flex:none;font-size:12px;font-weight:600;color:var(--c);background:var(--soft);padding:3px 9px;border-radius:99px;white-space:nowrap}
.compact .card{padding:7px 10px;gap:10px}
.compact .tile{width:34px;height:34px;font-size:18px;border-radius:11px}
.compact .nm{font-size:15px}
.compact .check{width:28px;height:28px}
.compact .av{width:24px;height:24px;font-size:11px}

.addmore{width:100%;margin-top:10px;padding:13px;border-radius:16px;border:1.5px dashed var(--line-strong);background:transparent;font-weight:600;font-size:15px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:10px 4px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

.empty{text-align:center;padding:38px 20px 20px}
.empty .big{font-size:40px;margin-bottom:6px}
.empty h3{margin:0 0 6px;font-size:20px;font-weight:700}
.empty p{margin:0 auto 18px;max-width:30ch;color:var(--muted);font-size:15px}
.empty.small{padding:28px 10px}

.btn{font-weight:600;font-size:15px;border-radius:12px;padding:11px 16px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.wide{width:100%}

.tipcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:8px 0 14px}
.tipcard h3{margin:0 0 8px;font-size:19px;font-weight:700}
.tipcard ul{margin:0 0 14px;padding-left:20px;color:var(--muted);font-size:14.5px}
.tipcard li{margin-bottom:5px}
.tipcard li b{color:var(--ink)}
.tipcard .row{display:flex;gap:8px;flex-wrap:wrap}

/* week */
.wk{margin:0 0 20px}
.wk-head{display:flex;width:100%;justify-content:space-between;align-items:baseline;background:none;border:0;padding:4px 2px 8px;text-align:left}
.wk-name{font-size:19px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.wk-name b{font-weight:800}
.wk.today .wk-name::after{content:"Vandaag";font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent);padding:2px 8px;border-radius:99px}
.wk-meta{font-size:13px;color:var(--muted)}
.wk-empty{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;border:1.5px dashed var(--line-strong);border-radius:14px;color:var(--muted);font-size:14px}
.wk-empty button{border:0;background:transparent;font-weight:600;font-size:14px;padding:6px 12px;border-radius:10px;color:var(--accent)}

/* tasks */
.hint{margin:8px 2px 12px;color:var(--muted);font-size:14.5px}
.hint b{color:var(--ink);font-weight:700}
.hint.sm{margin:0 2px 4px;font-size:13.5px}
.tools{display:flex;gap:8px;margin-bottom:10px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 12px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.btn-new{flex:none;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:0 16px;font-weight:700;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--c);color:var(--on-c);border-color:transparent}
.chip.all.on{background:var(--ink);color:var(--bg)}
.grp{margin-top:14px}
.grp h3{margin:0 0 8px 2px;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.grp .ge{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:16px}
.grp .gc{font-size:13px;font-weight:600;color:var(--muted)}

/* thuis */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.hcard h3{margin:0 0 12px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.hcard p.sm{margin:0 0 12px;color:var(--muted);font-size:14px}
.hero{background:linear-gradient(135deg,#4C66FF,#2233CC);color:#fff;border:0}
.hero-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.hero .lvl-emoji{flex:none;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:28px}
.lvl-name{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.lvl-sub{font-size:13.5px;opacity:.88;margin-top:2px}
.hbar{height:8px;background:rgba(255,255,255,.24);border-radius:99px;overflow:hidden;margin-bottom:14px}
.hbar i{display:block;height:100%;background:#fff;border-radius:99px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 4px;text-align:center}
.stats3 b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stats3 span{font-size:12px;opacity:.88}
.sum{display:flex;gap:18px;align-items:center}
.ring{--p:0;flex:none;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center}
.ring-in{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.ring-in b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sum h3{margin:0 0 2px}
.sum p{margin:0;color:var(--muted);font-size:14px}
.brow{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
.brow:last-child{margin-bottom:0}
.brow .bn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bc{color:var(--muted);font-size:13px;min-width:34px;text-align:right}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:99px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0;padding-top:0}
.prow .pt{flex:1;min-width:0}
.prow .pt b{display:block;font-weight:600;font-size:15.5px}
.prow .pt span{font-size:13px;color:var(--muted)}
.prow .tile{width:36px;height:36px;font-size:18px;border-radius:11px}
.prow .medal{flex:none;width:28px;text-align:center;font-size:22px}
.prow .pts{flex:none;font-weight:800;font-size:16px}
.iconbtn{flex:none;border:0;background:transparent;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);padding:0}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.textbtn{flex:none;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--danger);padding:6px 8px;border-radius:10px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow .inp{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:9px 0;border-radius:9px;font-weight:600;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line-strong)}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px 4px}
#nav button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--ink)}
#nav button[aria-current="page"] svg{stroke:var(--accent);stroke-width:2.2}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:75;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:14px;max-width:min(92vw,520px);font-size:14.5px;font-weight:500;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#toast button{flex:none;background:none;border:0;padding:2px 4px;font-weight:700;font-size:14.5px;color:var(--toast-btn)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40}
.sheet .backdrop{position:absolute;inset:0;background:rgba(10,14,24,.5);opacity:0;transition:opacity .2s}
.sheet.open .backdrop{opacity:1}
.panel{position:absolute;left:50%;bottom:0;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open .panel{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line-strong);margin:0 auto 12px}
.panel h2{margin:0 0 14px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sh-top{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.sh-top h2{margin:0;line-height:1.2}
.sh-top .inp{flex:1;min-width:0;font-weight:600}
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}

.tm-actions{display:flex;gap:10px}

.sp-check{stroke-dasharray:420;stroke-dashoffset:420;animation:spDraw .55s .65s ease-out forwards}

.sp-tag{color:#A9B4D8;font-size:16px;animation:spUp .6s 1.05s both}

@media (prefers-reduced-motion: reduce){

function streak(){
  let n=0,gap=0;
  const today=new Date();
  for(let i=0;i<180;i++){
    const dk=keyOf(addDays(today,-i));
    if(S.shielded&&S.shielded[dk])continue;
    const st=dayState(dk);
    if(st==='full'){
      if(n===0&&i>2)return 0;
      n++;gap=0;
    }else if(st==='open'){
      if(i===0)continue;
      break;
    }else{
      gap++;
      if(gap>2)break;
    }
  }
  return n;
}

function calcStats(){
  let done=0,pts=0,early=0;
  const per={},weeks={};
  Object.keys(S.plan).forEach(function(k){
    const wk=keyOf(mondayOf(fromKey(k)));
    (S.plan[k]||[]).forEach(function(t){
      const w=weeks[wk]=weeks[wk]||{n:0,d:0};
      w.n++;
      if(t.done){
        w.d++;done++;pts+=t.min;
        if(t.doneAt&&new Date(t.doneAt).getHours()<9)early++;
        if(t.who)per[t.who]=(per[t.who]||0)+1;
      }
    });
  });
  let perfect=0;
  Object.keys(weeks).forEach(k=>{if(weeks[k].n>=5&&weeks[k].d===weeks[k].n)perfect++;});
  const team=Object.keys(per).filter(id=>per[id]>=3&&personOf(id)).length;
  return {done:done,pts:S.earned,bal:balance(),shopped:S.stats.shopped||0,early:early,perfect:perfect,team:team,streak:streak(),timers:S.stats.timers||0,rolls:S.stats.rolls||0,bought:S.stats.bought||0};

function confetti(){

    const cf=CONFETTI.find(x=>x.id===S.confettiId)||CONFETTI[0];
    const c=document.createElement('canvas');c.className='confetti';
    const dpr=Math.min(2,window.devicePixelRatio||1),W=window.innerWidth,H=window.innerHeight;
    c.width=W*dpr;c.height=H*dpr;document.body.appendChild(c);
    const x=c.getContext('2d');x.scale(dpr,dpr);
    const cols=cf.cols||['#4C66FF','#1FA267','#F5A524','#E5484D','#A855F7','#06B6D4'];
    const ps=[];
    for(let i=0;i<(cf.emojis?70:120);i++){
      ps.push({x:W/2+(Math.random()-.5)*90,y:H*.55,vx:(Math.random()-.5)*12,vy:-(6+Math.random()*11),g:.3+Math.random()*.12,s:5+Math.random()*7,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],e:cf.emojis?cf.emojis[i%cf.emojis.length]:null});
    }
    const t0=performance.now();
    (function f(t){
      const el=t-t0;
      x.clearRect(0,0,W,H);
      ps.forEach(function(p){
        p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.r+=p.vr;
        x.save();x.translate(p.x,p.y);x.rotate(p.e?p.r*.3:p.r);x.globalAlpha=Math.max(0,1-el/2300);
        if(p.e){x.font=Math.round(p.s*2.6)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(p.e,0,0);}
        else{x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);}
        x.restore();
      });
      if(el<2300)requestAnimationFrame(f);else c.remove();
    })(t0);
  }catch(e){}
}

function ensureWeek(){
  let changed=false;
  for(let i=0;i<7;i++){
    const k=keyOf(addDays(S.weekStart,i));
    S.repeats.forEach(function(r){
      if(r.wd!==i||k<r.start)return;
      if((r.skip||[]).indexOf(k)>=0)return;
      const arr=(S.plan[k]=S.plan[k]||[]);
      if(arr.some(x=>x.rid===r.id))return;
      arr.push({id:uid(),rid:r.id,tid:r.tid,name:r.name,emoji:r.emoji,cat:r.cat,min:r.min,w:r.w||null,time:r.time||'any',who:r.who||null,note:r.note||'',done:false});

function dropRule(rid,fromKey){

  Object.keys(S.plan).forEach(function(k){
    S.plan[k]=(S.plan[k]||[]).filter(function(t){

      if(!t.done&&k>=fromKey)return false;

  });
}

function attachSwipe(row,opts){
  const card=row.querySelector('.card');
  const TH=84;
  let sx=0,sy=0,dx=0,id=null,state=0;
  row.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(e.target.closest('button'))return;
    state=1;sx=e.clientX;sy=e.clientY;dx=0;id=e.pointerId;
  });
  row.addEventListener('pointermove',function(e){
    if(state===0||e.pointerId!==id)return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(state===1){
      if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)*1.3){
        state=2;try{row.setPointerCapture(id);}catch(_){}
        row.classList.add('dragging');
      }else if(Math.abs(my)>10){state=0;return;}
      else return;
    }
    dx=mx;
    const can=dx>0?!!opts.right:!!opts.left;
    card.style.transform='translateX('+(can?dx:dx*0.18)+'px)';
    row.dataset.dir=can?(dx>0?'r':'l'):'';
    row.classList.toggle('armed',can&&Math.abs(dx)>TH);
  });
  function end(cancelled){
    if(state!==2){state=0;return;}
    state=0;
    row._dragEnd=Date.now();
    row.classList.remove('dragging','armed');
    const fn=dx>0?opts.right:opts.left;
    const fire=!cancelled&&fn&&Math.abs(dx)>TH;
    if(fire&&dx<0){
      card.style.transform='translateX(-105%)';
      setTimeout(fn,170);
    }else{
      card.style.transform='';
      if(fire)fn();
      setTimeout(function(){if(state===0)row.dataset.dir='';},230);
    }
  }
  row.addEventListener('pointerup',function(){end(false);});
  row.addEventListener('pointercancel',function(){end(true);});
}
function bindSwipes(root){
  $$('.swipe',root).forEach(function(row){
    if(row.classList.contains('plan')){
      attachSwipe(row,{
        right:function(){toggleDone(row.dataset.key,row.dataset.id);},
        left:function(){removePlanned(row.dataset.key,row.dataset.id);}
      });
    }else if(row.classList.contains('li')){
      attachSwipe(row,{
        right:function(){toggleLi(row.dataset.id);},
        left:function(){removeLi(row.dataset.id);}
      });
    }else{
      attachSwipe(row,{
        right:function(){addToDay(row.dataset.tid,S.sel);},
        left:row.dataset.custom?function(){deleteCustom(row.dataset.tid);}:null
      });
    }
  });
}

/* ---------- acties ---------- */
function toggleDone(key,id){
  const arr=S.plan[key]||[];
  const t=arr.find(x=>x.id===id);
  if(!t)return;
  const wasFull=arr.length>0&&arr.every(x=>x.done);
  t.done=!t.done;
  if(t.done){
    t.pts=pointsOf(t)*(boostActive()?2:1);t.doneAt=Date.now();S.earned+=t.pts;
  }else{
    const back=t.pts!=null?t.pts:pointsOf(t);
    S.earned=Math.max(0,S.earned-back);if(S.spent>S.earned)S.spent=S.earned;
    delete t.pts;delete t.doneAt;
  }
  const nowFull=arr.every(x=>x.done);
  if(t.done)S.pop=t.id;
  save();renderAll();S.pop=null;
  if(t.done){
    const chk=$('.check.pop');if(chk)floatPoints(chk,'+'+t.pts+' ⭐'+(boostActive()?' ⚡':''));
    haptic(14);
    if(nowFull&&!wasFull){
      confetti();haptic([20,40,20]);
      toast('Dag afgerond! 🎉 '+ptsOf(arr)+' punten');
    }
  }
  checkBadges();
}
function removePlanned(key,id){
  const arr=S.plan[key]||[];
  const i=arr.findIndex(x=>x.id===id);
  if(i<0)return;
  const before=snap();
  const t=arr.splice(i,1)[0];
  if(t.rid){
    const r=S.repeats.find(x=>x.id===t.rid);
    if(r){r.skip=r.skip||[];r.skip.push(key);}
  }
  save();renderAll();
  toast('Verwijderd: “'+t.name+'”','Ongedaan maken',function(){restore(before);});
}
function addToDay(tid,key){
  const t=taskById(tid);
  if(!t)return;
  const before=snap();
  const item=makeItem(t);
  (S.plan[key]=S.plan[key]||[]).push(item);
  save();renderStrip();refreshBadges();
  haptic(10);
  toast(t.name+' toegevoegd aan '+dow(key),'Ongedaan maken',function(){restore(before);});
}
function deleteCustom(tid){
  const i=S.custom.findIndex(x=>x.id===tid);
  if(i<0)return;
  const t=S.custom.splice(i,1)[0];
  save();renderTaskList();

    S.custom.splice(Math.min(i,S.custom.length),0,t);

  });
}
function clearDay(){
  const arr=S.plan[S.sel]||[];
  if(!arr.length)return;
  const before=snap();
  arr.forEach(function(t){
    if(t.rid){const r=S.repeats.find(x=>x.id===t.rid);if(r){r.skip=r.skip||[];r.skip.push(S.sel);}}
  });
  S.plan[S.sel]=[];
  save();renderAll();
  toast('Dag geleegd: '+dow(S.sel),'Ongedaan maken',function(){restore(before);});
}
function copyWeek(){
  const before=snap();let n=0;
  for(let i=0;i<7;i++){
    const k=keyOf(addDays(S.weekStart,i)),nk=keyOf(addDays(S.weekStart,i+7));
    (S.plan[k]||[]).forEach(function(t){
      if(t.rid)return;
      const c=JSON.parse(JSON.stringify(t));
      c.id=uid();c.done=false;
      (S.plan[nk]=S.plan[nk]||[]).push(c);n++;
    });
  }
  save();renderAll();
  if(n)toast(nTaken(n)+' gekopieerd naar volgende week','Ongedaan maken',function(){restore(before);});
  else toast('Niets om te kopiëren. Wekelijkse routines herhalen zichzelf.');

function addStarter(){
  const before=snap();
  const cur=keyOf(mondayOf(new Date()))===keyOf(S.weekStart);
  const start=cur?todayKey():keyOf(S.weekStart);
  let n=0;
  STARTER.forEach(function(row){
    const t=BUILTIN.find(x=>x.id===row[0]);
    if(!t)return;
    row[2].forEach(function(wd){
      if(S.repeats.some(r=>r.tid===t.id&&r.wd===wd))return;
      S.repeats.push(makeRule({tid:t.id,name:t.name,emoji:t.emoji,cat:t.cat,min:t.min,time:row[1]},wd,start));n++;
    });
  });
  S.tip=true;save();renderAll();
  if(n)toast('Startroutine toegevoegd','Ongedaan maken',function(){restore(before);});
  else toast('De startroutine staat al in je routines.');
}
function splitFair(){
  if(S.people.length<2){toast('Voeg eerst minstens twee mensen toe.');return;}
  const before=snap();
  const items=weekItems();
  const load={};
  S.people.forEach(p=>{load[p.id]=0;});
  items.forEach(t=>{if(t.who&&load[t.who]!==undefined)load[t.who]+=pointsOf(t);});
  const un=items.filter(t=>!t.who&&!t.done).sort((a,b)=>pointsOf(b)-pointsOf(a));
  if(!un.length){toast('Alle taken hebben al een eigenaar.');return;}
  un.forEach(function(t){
    let best=S.people[0];
    S.people.forEach(p=>{if(load[p.id]<load[best.id])best=p;});
    t.who=best.id;load[best.id]+=pointsOf(t);
  });
  save();renderAll();
  toast(nTaken(un.length)+' eerlijk verdeeld','Ongedaan maken',function(){restore(before);});
}

/* ---------- timer ---------- */
let TM=null;
function beep(){
  try{
    const a=TM&&TM.ac;
    if(!a)return;
    if(a.resume)a.resume();
    [0,.28,.56].forEach(function(d){
      const o=a.createOscillator(),g=a.createGain();
      o.frequency.value=880;g.gain.value=.16;
      o.connect(g);g.connect(a.destination);
      o.start(a.currentTime+d);o.stop(a.currentTime+d+.16);
    });
  }catch(e){}
}
function startTimer(key,id,minutes){
  const it=(S.plan[key]||[]).find(x=>x.id===id);
  if(!it)return;
  stopTimer();
  let ac=null;
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){ac=new AC();if(ac.resume)ac.resume();}}catch(e){}
  const total=Math.max(1,minutes||it.min)*60;
  TM={key:key,id:id,name:it.name,emoji:it.emoji,total:total,end:Date.now()+total*1000,paused:false,left:total,over:false,ac:ac,lock:null,iv:null};
  try{
    if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){if(TM)TM.lock=l;else l.release();}).catch(function(){});
  }catch(e){}
  renderTimer();
  $('#timer').hidden=false;
  TM.iv=setInterval(tickTimer,250);
}
function stopTimer(){
  if(!TM)return;
  clearInterval(TM.iv);
  try{if(TM.lock)TM.lock.release();}catch(e){}
  try{if(TM.ac&&TM.ac.close)TM.ac.close();}catch(e){}
  TM=null;
  const t=$('#timer');t.hidden=true;t.innerHTML='';
}
function tickTimer(){
  if(!TM||TM.paused)return;
  TM.left=Math.max(0,Math.ceil((TM.end-Date.now())/1000));
  paintTimer();
  if(TM.left===0&&!TM.over){
    TM.over=true;beep();haptic([200,100,200]);renderTimer();
  }
}
function paintTimer(){
  if(!TM)return;
  const m=Math.floor(TM.left/60),s=TM.left%60;
  const t=$('#tm-time'),r=$('#tm-ring');
  if(t)t.textContent=pad(m)+':'+pad(s);
  if(r)r.style.setProperty('--p',Math.round((1-TM.left/TM.total)*100));
}
function renderTimer(){
  if(!TM)return;
  const el=$('#timer');
  el.className=TM.over?'tm-over':'';
  el.innerHTML='<div class="tm-wrap"><div class="tm-top"><button class="linkbtn" type="button" data-act="timerstop">Stop</button></div>'
    +'<div class="tm-body"><div class="tm-emoji">'+esc(TM.emoji)+'</div><h2>'+esc(TM.name)+'</h2>'
    +'<div class="tm-ring" id="tm-ring"><div class="tm-in"><b id="tm-time">00:00</b><span>'+(TM.over?'Tijd is om!':(TM.paused?'gepauzeerd':'bezig'))+'</span></div></div></div>'
    +'<div class="tm-actions">'
    +(TM.over?'<button class="btn" type="button" data-act="timermore">+ 5 min</button>':'<button class="btn" type="button" data-act="timerpause">'+(TM.paused?'Hervat':'Pauze')+'</button>')
    +'<button class="btn primary" type="button" data-act="timerdone">Klaar ✅</button></div></div>';
  paintTimer();
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg,label,fn){
  const t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<button type="button">'+esc(label)+'</button>':'');
  if(label)t.querySelector('button').onclick=function(){fn();t.classList.remove('show');};
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},5000);
}

/* ---------- opbouw: kader ---------- */
function renderHead(){
  $('#range').textContent=rangeText();
  const cur=keyOf(mondayOf(new Date()))===keyOf(S.weekStart);
  const yr=addDays(S.weekStart,6).getFullYear();
  $('#wk').textContent='Week '+isoWeek(S.weekStart)+(yr!==new Date().getFullYear()?', '+yr:'')+(cur?' · deze week':'');
}
function renderStrip(){
  const strip=$('#strip');
  const hide=S.tab==='week'||S.tab==='home'||S.tab==='list'||S.tab==='shop';
  strip.hidden=hide;
  $('#top').classList.toggle('compact-top',hide);
  let html='';
  for(let i=0;i<7;i++){
    const d=addDays(S.weekStart,i),k=keyOf(d),list=S.plan[k]||[];
    const dots=list.slice(0,4).map(t=>'<i class="dot'+(t.done?' done':'')+'" style="--h:'+catOf(t.cat).hue+'"></i>').join('');
    html+='<button class="day'+(k===S.sel?' sel':'')+(k===todayKey()?' today':'')+'" data-act="sel" data-key="'+k+'" aria-pressed="'+(k===S.sel)+'" aria-label="'+esc(longLabel(k))+', '+nTaken(list.length)+'">'
      +'<span class="dn">'+cap(dow(k))+'</span><span class="dd">'+d.getDate()+'</span><span class="dots">'+dots+'</span></button>';
  }
  strip.innerHTML=html;
}
function renderNav(){
  $$('#nav button').forEach(function(b){
    if(b.dataset.tab===(S.tab==='shop'?'home':S.tab))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
}
function renderAll(){
  if(S.who!=='all'&&!personOf(S.who))S.who='all';
  if(S.addWho&&!personOf(S.addWho))S.addWho='';
  ensureWeek();
  $('#main').classList.remove('enter');
  renderHead();renderStrip();renderNav();
  if(S.tab==='day')renderDay();
  else if(S.tab==='week')renderWeek();
  else if(S.tab==='tasks')renderTasks();
  else if(S.tab==='list')renderList();
  else if(S.tab==='shop')renderShop();
  else renderHome();
  S.anim=false;
}
function afterRender(root){
  root.classList.toggle('enter',!!S.anim);
  if(S.anim)$$('.swipe',root).forEach(function(r,i){r.style.setProperty('--i',Math.min(i,12));});
}

/* ---------- opbouw: rijen ---------- */

  const c=catOf(t.cat),p=personOf(t.who);
  const tm=t.time&&t.time!=='any'?TIMES.find(x=>x[0]===t.time):null;
  return '<div class="swipe plan cat'+(compact?' compact':'')+'" data-key="'+key+'" data-id="'+t.id+'" style="--h:'+c.hue+';--rbg:'+(t.done?'var(--muted)':'var(--ok)')+'">'
    +'<div class="bg"><span class="bg-r">'+(t.done?'Terugzetten':'Klaar')+'</span><span class="bg-l">Verwijderen</span></div>'
    +'<div class="card'+(t.done?' isdone':'')+'">'
    +'<span class="tile">'+esc(t.emoji)+'</span>'
    +'<div class="txt"><div class="nm">'+esc(t.name)+'</div>'
    +'<div class="sub"><span class="cn">'+esc(c.name)+'</span><span>'+fmtMin(t.min)+'</span><span>⭐ '+(t.done?earnedOf(t):pointsOf(t)*(boostActive()?2:1))+'</span>'
    +(tm&&compact?'<span>'+tm[1]+'</span>':'')

    +(t.note?'<div class="note">'+esc(t.note)+'</div>':'')+'</div>'

    +'<button class="check'+(S.pop===t.id?' pop':'')+'" type="button" data-act="check" aria-pressed="'+!!t.done+'" aria-label="'+(t.done?'Markeer als niet klaar':'Markeer als klaar')+'">'+ICON_CHECK+'</button>'

function whoBar(){
  if(!S.people.length)return '';
  return '<div class="chips whobar" id="whobar"><button class="chip all'+(S.who==='all'?' on':'')+'" type="button" data-act="whof" data-w="all">Iedereen</button>'

/* ---------- opbouw: dag ---------- */
function renderDay(){
  const main=$('#main');
  const all=S.plan[S.sel]||[];
  const list=sortTimes(all.filter(vis));
  const done=list.filter(t=>t.done).length;
  const mins=list.reduce((a,t)=>a+t.min,0);
  const pct=list.length?Math.round(done/list.length*100):0;
  const pts=ptsOf(list),st=streak();
  let html='';
  if(!S.tip&&!all.length&&!S.repeats.length){
    html+='<div class="tipcard"><h3>Welkom bij Huisweek</h3><ul>'
      +'<li><b>Tab Taken:</b> veeg een taak naar rechts om hem te plannen op de dag die je hebt gekozen.</li>'
      +'<li><b>Tik op een taak</b> om dagen, een dagdeel, wie het doet of een wekelijkse herhaling te kiezen.</li>'
      +'<li><b>Tab Dag:</b> veeg naar rechts als het klaar is, naar links om te verwijderen.</li></ul>'
      +'<div class="row"><button class="btn primary" type="button" data-act="starter">Startroutine toevoegen</button><button class="btn" type="button" data-act="tipdone">Zelf beginnen</button></div></div>';
  }
  html+=whoBar();
  html+='<section class="dayhead">'+(S.sel===todayKey()?'<p class="greet">'+greet()+' 👋</p>':'')
    +'<h2>'+esc(longLabel(S.sel))+'</h2><p>'
    +(list.length?done+' van '+list.length+' klaar, '+fmtMin(mins)+' gepland':(all.length?'Niets voor deze persoon':'Nog niets gepland'))+'</p>'
    +((st>0||pts>0||boostActive()||S.shielded[S.sel])?'<div class="pills">'+(st>0?'<span class="pill">🔥 '+st+(st===1?' dag':' dagen')+' op rij</span>':'')+(pts>0?'<span class="pill">⭐ '+pts+' punten</span>':'')+(boostActive()?'<span class="pill">⚡ Dubbele punten tot '+boostTime()+'</span>':'')+(S.shielded[S.sel]?'<span class="pill">🛡️ Beschermd</span>':'')+'</div>':'')
    +(list.length?'<div class="prog" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>':'')
    +'</section>';
  html+=lateBanner();
  if(list.length){
    const groups=TIMES.map(function(tm){return {tm:tm,items:list.filter(t=>(t.time||'any')===tm[0])};}).filter(g=>g.items.length);
    const flat=groups.length===1&&groups[0].tm[0]==='any';
    html+=groups.map(function(g){
      return (flat?'':'<h3 class="tgrp">'+g.tm[2]+' '+g.tm[1]+'</h3>')
        +'<div class="list">'+g.items.map(t=>planRow(t,S.sel)).join('')+'</div>';
    }).join('');
    html+='<p class="tip">Veeg naar rechts om af te ronden, naar links om te verwijderen. Tik op een taak om hem aan te passen.</p>'
      +'<button class="addmore" type="button" data-act="tab" data-tab="tasks">Meer taken toevoegen</button>'
      +shieldBtn(all)+'<div style="text-align:center"><button class="linkbtn" type="button" data-act="clearday">Deze dag leegmaken</button></div>';
  }else if(!all.length){
    html+='<div class="empty"><div class="big">🗓️</div><h3>Deze dag is nog leeg</h3>'
      +'<p>Kies taken in het tabblad Taken en veeg ze naar rechts om deze dag te plannen.</p>'
      +'<button class="btn primary" type="button" data-act="tab" data-tab="tasks">Taken bekijken</button>'
      +(S.repeats.length?'':'<div><button class="linkbtn" type="button" data-act="starter">Of voeg een startroutine toe</button></div>')
      +'</div>';
  }
  main.innerHTML=html;
  bindSwipes(main);
  afterRender(main);
}

/* ---------- opbouw: week ---------- */
function renderWeek(){
  const main=$('#main');
  let html=whoBar();
  for(let i=0;i<7;i++){
    const d=addDays(S.weekStart,i),k=keyOf(d);
    const list=sortTimes((S.plan[k]||[]).filter(vis));
    const mins=list.reduce((a,t)=>a+t.min,0);
    html+='<section class="wk'+(k===todayKey()?' today':'')+'">'
      +'<button class="wk-head" type="button" data-act="openday" data-key="'+k+'">'
      +'<span class="wk-name">'+cap(dow(k))+' <b>'+d.getDate()+'</b></span>'
      +'<span class="wk-meta">'+(list.length?nTaken(list.length)+', '+fmtMin(mins):'Geen taken')+'</span></button>';
    if(list.length)html+='<div class="list">'+list.map(t=>planRow(t,k,true)).join('')+'</div>';

function renderTaskList(){
  const el=$('#tasklist');

  const q=S.q.trim().toLowerCase();

  })).filter(g=>g.items.length);

function refreshBadges(){
  if(S.tab!=='tasks')return;
  const counts={};
  (S.plan[S.sel]||[]).forEach(p=>{counts[p.tid]=(counts[p.tid]||0)+1;});
  const d=dow(S.sel);
  $$('.swipe.lib').forEach(function(r){
    const n=counts[r.dataset.tid]||0;
    const b=r.querySelector('.planned');
    b.hidden=!n;
    b.textContent='Op '+d+(n>1?' ×'+n:'');
    r.querySelector('.bg-r').textContent='Toevoegen aan '+d;

}

/* ---------- winkel ---------- */
function findItem(kind,id){
  const list=kind==='theme'?THEMES:(kind==='conf'?CONFETTI:EXTRAS);
  return list.find(x=>x.id===id);
}
function clearPreview(){
  if(!S.preview)return;
  S.preview=null;applyThemeStyle();
}
function buyItem(kind,id){
  const it=findItem(kind,id);
  if(!it)return;
  if(kind!=='extra'&&S.owned.indexOf(kind+':'+id)>=0)return;
  if(balance()<it.price){
    toast('Nog '+(it.price-balance())+' punten nodig voor '+it.name+'.');haptic([30,40]);
    return;
  }
  S.spent+=it.price;
  S.stats.shopped=(S.stats.shopped||0)+1;
  if(kind==='extra'){
    if(id==='boost')S.boostUntil=Math.max(Date.now(),S.boostUntil||0)+86400000;
    else S.shields=(S.shields||0)+1;
  }else{
    S.owned.push(kind+':'+id);
    if(kind==='theme'){S.themeId=id;S.preview=null;applyThemeStyle();}
    else S.confettiId=id;
  }
  save();renderShop();confetti();haptic([20,30,20]);
  toast('Gekocht: '+it.emoji+' '+it.name);
  checkBadges();
}
function equipItem(kind,id){
  if(S.owned.indexOf(kind+':'+id)<0)return;
  if(kind==='theme'){S.themeId=id;S.preview=null;applyThemeStyle();}
  else S.confettiId=id;
  save();renderShop();
  const it=findItem(kind,id);
  toast(it.emoji+' '+it.name+' is nu actief');
  if(kind==='conf')confetti();
}
function previewTheme(id){
  const th=findItem('theme',id);
  if(!th)return;
  S.preview=id;applyThemeStyle();
  toast('Voorbeeld: '+th.emoji+' '+th.name,'Terug',function(){clearPreview();});
  setTimeout(function(){if(S.preview===id)clearPreview();},9000);
}
function useShield(key){
  if((S.shields||0)<1||S.shielded[key])return;
  S.shields--;S.shielded[key]=true;
  save();renderAll();
  toast('🛡️ Reeksschild gebruikt. Je reeks is veilig.');
}
function shieldBtn(all){
  if(!(S.shields>0)||S.sel>=todayKey()||S.shielded[S.sel]||!all.some(t=>!t.done))return '';
  return '<div style="text-align:center"><button class="linkbtn" type="button" data-act="useshield" data-key="'+S.sel+'">🛡️ Reeksschild gebruiken ('+S.shields+')</button></div>';
}
function buyBtn(kind,it,bal){
  const aff=bal>=it.price;
  return '<button class="btn wide'+(aff?' primary':' locked')+'" type="button" data-act="buy" data-k="'+kind+'" data-id="'+it.id+'">'+(aff?'Koop ⭐ '+it.price:'🔒 ⭐ '+it.price)+'</button>';
}

let HOME_GROUPS=[];
function renderHome(){
  const main=$('#main');
  const items=weekItems();
  const total=items.length,done=items.filter(t=>t.done).length;

  const byCat={};

  html+='<div class="hcard"><h3>Mensen</h3>';

  html+='</div>';

  html+='<div class="hcard"><h3>Weektools</h3><div class="stack">'
    +'<button class="btn wide" type="button" data-act="splitfair">⚖️ Verdeel taken eerlijk</button>'

    +[['auto','Auto'],['light','Licht'],['dark','Donker']].map(x=>'<button type="button" data-act="theme" data-th="'+x[0]+'" aria-pressed="'+(S.theme===x[0])+'">'+x[1]+'</button>').join('')

/* ---------- sheets ---------- */
let CUR=null,FM=null,TS=null;
function openSheetWith(fn){
  $('#toast').classList.remove('show');
  CUR=fn;fn();
  const sh=$('#sheet');
  sh.hidden=false;
  requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add('open');});});
}
function redraw(focusId){
  if(!CUR)return;
  const p=$('#sheet .panel'),st=p?p.scrollTop:0;
  CUR(focusId);
  const q=$('#sheet .panel');
  if(q)q.scrollTop=st;
}
function closeSheet(){
  const sh=$('#sheet');
  sh.classList.remove('open');
  CUR=null;FM=null;TS=null;
  setTimeout(function(){if(!CUR){sh.hidden=true;sh.innerHTML='';}},260);
}
function weightSection(w,tid,min,act){
  const eff=w||defaultW({tid:tid,min:min});
  const pts=Math.max(5,Math.round(min*eff/5)*5);
  return '<div class="fld"><span>Zwaarte <small style="font-weight:600;color:var(--muted)">→ ⭐ '+pts+' punten</small></span><div class="opts">'
    +WEIGHTS.map(x=>'<button type="button" class="opt'+(eff===x[0]?' on':'')+'" data-act="'+act+'" data-w="'+x[0]+'">'+x[1]+' '+x[2]+'</button>').join('')+'</div></div>';
}
function minChips(cur){
  return [5,10,15,20,30,45,60,90].map(m=>'<button type="button" class="opt'+(cur===m?' on':'')+'" data-act="'+(TS?'tmin':'fmin')+'" data-m="'+m+'">'+fmtMin(m)+'</button>').join('');
}

/* taak plannen / aanpassen */
function openTaskSheet(o){
  if(o.mode==='add'){
    const t=taskById(o.tid);
    if(!t)return;
    TS={mode:'add',tid:t.id,name:t.name,emoji:t.emoji,cat:t.cat,min:t.min,w:t.w||null,days:[S.sel],time:DEF[t.id]||'any',who:S.addWho||null,note:'',repeat:false,hadRule:false,err:''};
  }else{
    const it=(S.plan[o.key]||[]).find(x=>x.id===o.id);
    if(!it)return;
    const rule=it.rid?S.repeats.find(r=>r.id===it.rid):null;
    TS={mode:'edit',key:o.key,id:it.id,tid:it.tid,name:it.name,emoji:it.emoji,cat:it.cat,min:it.min,w:it.w||null,days:[o.key],time:it.time||'any',who:it.who||null,note:it.note||'',repeat:!!rule,hadRule:!!rule,err:''};
  }
  openSheetWith(renderTaskSheet);
}
function renderTaskSheet(focusId){
  const T=TS,multi=T.mode==='add',c=catOf(T.cat);
  let days='';
  for(let i=0;i<7;i++){
    const k=keyOf(addDays(S.weekStart,i)),on=T.days.indexOf(k)>=0;
    days+='<button type="button" class="opt'+(on?' on':'')+'" data-act="tday" data-k="'+k+'" aria-pressed="'+on+'">'+cap(dow(k))+' '+fromKey(k).getDate()+'</button>';
  }
  const when=TIMES.slice().sort((a,b)=>(a[0]==='any'?-1:0)-(b[0]==='any'?-1:0)).map(x=>'<button type="button" class="opt'+(T.time===x[0]?' on':'')+'" data-act="ttime" data-t="'+x[0]+'">'+x[2]+' '+x[1]+'</button>').join('');
  const who=S.people.length
    ?'<div class="fld"><span>Wie doet het</span><div class="opts"><button type="button" class="opt'+(!T.who?' on':'')+'" data-act="twho" data-w="">Niemand</button>'
      +S.people.map(p=>'<button type="button" class="opt cat'+(T.who===p.id?' on':'')+'" data-act="twho" data-w="'+p.id+'" style="--h:'+p.hue+'">'+esc(p.name)+'</button>').join('')+'</div></div>'
    :'';
  const sh=$('#sheet');
  sh.innerHTML='<div class="backdrop" data-act="closesheet"></div>'
  +'<div class="panel" role="dialog" aria-modal="true" aria-label="'+(multi?'Taak plannen':'Taak aanpassen')+'">'
  +'<div class="grab"></div>'
  +'<div class="sh-top"><span class="tile cat" style="--h:'+c.hue+'">'+esc(T.emoji)+'</span>'
  +(multi?'<h2>'+esc(T.name)+'</h2>':'<input class="inp" id="t-name" type="text" maxlength="60" aria-label="Naam van de taak" value="'+esc(T.name)+'">')+'</div>'
  +'<div class="fld"><span>'+(multi?'Dagen (kies er een of meer)':'Dag')+'</span><div class="opts">'+days+'</div></div>'
  +'<div class="fld"><span>Wanneer</span><div class="opts">'+when+'</div></div>'
  +who
  +'<div class="fld"><span>Benodigde tijd</span><div class="opts">'+minChips(T.min)+'</div></div>'
  +weightSection(T.w,T.tid,T.min,'tw')
  +'<label class="fld"><span>Notitie</span><input class="inp" id="t-note" type="text" maxlength="80" placeholder="Optioneel" autocomplete="off" value="'+esc(T.note)+'"></label>'
  +'<button type="button" class="toggle" role="switch" aria-checked="'+T.repeat+'" data-act="trep"><span>Elke week herhalen'+(multi&&T.days.length>1?' op deze dagen':'')+'</span><i class="knob"></i></button>'
  +(T.hadRule?'<p class="help">Zet dit uit om vanaf deze dag te stoppen met herhalen.</p>':'')
  +(multi?'':'<button type="button" class="btn wide" data-act="timerstart" style="margin-bottom:12px">⏱️ Timer starten ('+fmtMin(T.min)+')</button>')
  +(T.err?'<p class="err">'+esc(T.err)+'</p>':'')
  +'<div class="actions">'
  +(multi?'<button type="button" class="btn ghost" data-act="closesheet">Annuleren</button><button type="button" class="btn primary" data-act="tsave">Toevoegen aan '+T.days.length+(T.days.length===1?' dag':' dagen')+'</button>'
         :'<button type="button" class="btn danger" data-act="tdelete">Verwijderen</button><button type="button" class="btn primary" data-act="tsave">Opslaan</button>')
  +'</div></div>';
  if(focusId){const i=$('#'+focusId);if(i)i.focus();}
}
function saveTaskSheet(){
  const T=TS;
  if(T.mode==='add'){
    if(!T.days.length){T.err='Kies minstens één dag.';redraw();return;}
    const note=T.note.trim();
    T.days.slice().sort().forEach(function(k){
      const item={id:uid(),tid:T.tid,name:T.name,emoji:T.emoji,cat:T.cat,min:T.min,w:T.w||null,time:T.time,who:T.who,note:note,done:false};
      if(T.repeat){
        const r=makeRule({tid:T.tid,name:T.name,emoji:T.emoji,cat:T.cat,min:T.min,w:T.w,time:T.time,who:T.who,note:note},wdOf(k),k);
        S.repeats.push(r);item.rid=r.id;
      }
      (S.plan[k]=S.plan[k]||[]).push(item);
    });
    const n=T.days.length,rep=T.repeat;
    save();closeSheet();renderAll();
    toast('Toegevoegd aan '+n+(n===1?' dag':' dagen')+(rep?', herhaalt wekelijks':''));
    return;
  }
  const arr=S.plan[T.key]||[];
  const it=arr.find(x=>x.id===T.id);
  if(!it){closeSheet();return;}
  const name=T.name.trim();
  if(!name){T.err='Geef de taak een naam.';redraw('t-name');return;}
  it.name=name;it.min=T.min;it.w=T.w||null;it.time=T.time;it.who=T.who;it.note=T.note.trim();
  let rule=it.rid?S.repeats.find(r=>r.id===it.rid):null;
  if(rule&&!T.repeat){
    delete it.rid;dropRule(rule.id,T.key);rule=null;
  }else if(rule){
    rule.name=name;rule.min=T.min;rule.w=T.w||null;rule.time=T.time;rule.who=T.who;rule.note=it.note;
  }
  const newKey=T.days[0]||T.key;
  let fk=T.key;
  if(newKey!==T.key){
    if(it.rid){
      const cr=S.repeats.find(r=>r.id===it.rid);
      if(cr){cr.skip=cr.skip||[];cr.skip.push(T.key);}
      delete it.rid;
    }
    const src=S.plan[T.key]||[];
    const idx=src.indexOf(it);
    if(idx>=0)src.splice(idx,1);
    (S.plan[newKey]=S.plan[newKey]||[]).push(it);
    fk=newKey;
  }
  if(!rule&&!T.hadRule&&T.repeat){
    const r=makeRule({tid:it.tid,name:it.name,emoji:it.emoji,cat:it.cat,min:it.min,w:it.w,time:it.time,who:it.who,note:it.note},wdOf(fk),fk);
    S.repeats.push(r);it.rid=r.id;
  }
  save();closeSheet();renderAll();
  toast(newKey!==T.key?'Verplaatst naar '+dow(newKey):'Taak bijgewerkt');
}

  S.intro=INTRO_V;save();
  const el=$('#intro');
  el.classList.add('out');
  setTimeout(function(){el.hidden=true;el.innerHTML='';},320);
}
function shopHint(){
  if(S.shopHint||S.intro<INTRO_V)return;
  S.shopHint=true;save();
  toast('Nieuw: de winkel! Koop thema’s met je punten. 🛍️','Bekijken',function(){setTab('shop');});
}
function runSplash(){
  const sp=$('#splash');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(S.intro<INTRO_V)openIntro();
  let closed=false;
  function close(){
    if(closed)return;closed=true;
    sp.classList.add('out');
    setTimeout(function(){sp.hidden=true;},480);
    setTimeout(shopHint,1200);
  }
  sp.addEventListener('click',close);
  setTimeout(close,reduce?900:2200);
}

/* ---------- app-icoon als terugval ---------- */
(function(){
  const link=document.querySelector('link[rel="apple-touch-icon"]');
  if(!link)return;
  const ICON_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C66FF"/><stop offset="1" stop-color="#2233CC"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g)"/><path d="M512 206 L846 484 V822 H178 V484 Z" fill="#fff" stroke="#fff" stroke-width="48" stroke-linejoin="round"/><path d="M368 552 L476 660 L664 458" fill="none" stroke="#1FA267" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const probe=new Image();
  probe.onerror=function(){
    const img=new Image();
    img.onload=function(){
      try{
        const c=document.createElement('canvas');c.width=c.height=180;
        c.getContext('2d').drawImage(img,0,0,180,180);
        link.href=c.toDataURL('image/png');
      }catch(e){}
    };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ICON_SVG);
  };
  probe.src=link.href;
})();

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');
  if(!b){
    const row=e.target.closest('.swipe');
    if(row&&!e.target.closest('.sheet')){
      if(row._dragEnd&&Date.now()-row._dragEnd<350)return;
      if(row.classList.contains('plan'))openTaskSheet({mode:'edit',key:row.dataset.key,id:row.dataset.id});
      else if(row.classList.contains('li'))toggleLi(row.dataset.id);
      else openTaskSheet({mode:'add',tid:row.dataset.tid});
    }
    return;
  }
  const a=b.dataset.act;
  if(a==='tab')setTab(b.dataset.tab);
  else if(a==='sel')selectDay(b.dataset.key);
  else if(a==='prev')shiftWeek(-7);
  else if(a==='next')shiftWeek(7);
  else if(a==='today')goToday();
  else if(a==='check'){const r=b.closest('.swipe');toggleDone(r.dataset.key,r.dataset.id);}
  else if(a==='add'){const r=b.closest('.swipe');addToDay(r.dataset.tid,S.sel);}
  else if(a==='filter'){
    S.filter=b.dataset.f;
    $$('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.f===S.filter));
    renderTaskList();
  }
  else if(a==='whof'){S.who=b.dataset.w;if(S.tab==='week')renderWeek();else renderDay();}
  else if(a==='assignto'){
    S.addWho=b.dataset.w;
    $$('#assignbar .chip').forEach(c=>c.classList.toggle('on',c.dataset.w===S.addWho));
  }
  else if(a==='openday'){S.sel=b.dataset.key;S.tab='day';S.anim=true;renderAll();window.scrollTo(0,0);}
  else if(a==='planday'){S.sel=b.dataset.key;S.tab='tasks';renderAll();window.scrollTo(0,0);}
  else if(a==='clearday')clearDay();
  else if(a==='starter')addStarter();
  else if(a==='tipdone'){S.tip=true;save();renderDay();}
  else if(a==='copyweek')copyWeek();
  else if(a==='splitfair')splitFair();
  else if(a==='shareweek')shareWeek();
  else if(a==='addperson'){
    const i=$('#p-name');
    if(i&&addPerson(i.value)){const n=$('#p-name');if(n)n.focus();}
    else if(i)i.focus();
  }
  else if(a==='delperson')removePerson(b.dataset.id);
  else if(a==='stoprule'){
    const gr=HOME_GROUPS[Number(b.dataset.gi)];
    if(gr){
      const before=snap();
      S.repeats.filter(r=>r.tid===gr.r.tid&&r.name===gr.r.name).map(r=>r.id).forEach(id=>dropRule(id,todayKey()));
      save();renderAll();
      toast('Gestopt met “'+gr.r.name+'”','Ongedaan maken',function(){restore(before);});
    }
  }
  else if(a==='theme'){S.theme=b.dataset.th;applyTheme();save();renderHome();}
  else if(a==='reset'){
    b.dataset.act='reset2';b.textContent='Tik nogmaals om alles te wissen';
    setTimeout(function(){if(b.isConnected&&b.dataset.act==='reset2'){b.dataset.act='reset';b.textContent='Wis al mijn gegevens';}},4000);
  }
  else if(a==='reset2'){
    try{localStorage.removeItem(STORE);}catch(_){}
    S.plan={};S.custom=[];S.customCats=[];S.repeats=[];S.people=[];S.theme='auto';S.tip=false;S.intro=0;S.earned=0;S.spent=0;S.owned=['theme:default','conf:classic'];S.themeId='default';S.confettiId='classic';S.boostUntil=0;S.shields=0;S.shielded={};S.preview=null;S.shopHint=false;S.list=[];S.badges=[];S.stats={timers:0,rolls:0,bought:0};S.who='all';S.addWho='';S.filter='all';S.q='';
    applyTheme();applyThemeStyle();S.tab='day';renderAll();window.scrollTo(0,0);
    toast('Alle gegevens gewist');
  }
  else if(a==='intro')openIntro();
  else if(a==='introskip')finishIntro();
  else if(a==='intronext'){
    if(IN>=SLIDES.length-1)finishIntro();
    else{IN++;renderIntro(true);}
  }
  else if(a==='newtask')openNewTask({name:b.dataset.name,cat:b.dataset.cat});
  else if(a==='closesheet')closeSheet();
  else if(a==='fcat'){FM.cat=b.dataset.c;FM.nb=false;FM.err='';redraw();}
  else if(a==='fnb'){FM.nb=!FM.nb;FM.err='';redraw(FM.nb?'f-bname':null);}
  else if(a==='fmin'){FM.min=Number(b.dataset.m);redraw();}
  else if(a==='falso'){FM.also=!FM.also;redraw();}
  else if(a==='savetask')saveNewTask();
  else if(a==='tday'){
    const k=b.dataset.k;
    if(TS.mode==='add'){
      const i=TS.days.indexOf(k);
      if(i>=0)TS.days.splice(i,1);else TS.days.push(k);
    }else TS.days=[k];
    TS.err='';redraw();
  }
  else if(a==='ttime'){TS.time=b.dataset.t;redraw();}
  else if(a==='twho'){TS.who=b.dataset.w||null;redraw();}
  else if(a==='tmin'){TS.min=Number(b.dataset.m);redraw();}
  else if(a==='trep'){TS.repeat=!TS.repeat;redraw();}
  else if(a==='tsave')saveTaskSheet();
  else if(a==='tdelete'){
    const k=TS.key,id=TS.id;
    closeSheet();removePlanned(k,id);
  }
  else if(a==='timerstart'){
    const k=TS.key,id=TS.id,m=TS.min;
    closeSheet();startTimer(k,id,m);
  }
  else if(a==='timerpause'&&TM){
    if(!TM.paused){TM.paused=true;TM.left=Math.max(0,Math.ceil((TM.end-Date.now())/1000));}
    else{TM.paused=false;TM.end=Date.now()+TM.left*1000;}
    renderTimer();
  }
  else if(a==='timermore'&&TM){
    TM.total=300;TM.end=Date.now()+300000;TM.left=300;TM.over=false;renderTimer();
  }
  else if(a==='timerdone'&&TM){
    const k=TM.key,id=TM.id;
    stopTimer();
    const it=(S.plan[k]||[]).find(x=>x.id===id);
    if(it&&!it.done){S.stats.timers=(S.stats.timers||0)+1;save();toggleDone(k,id);}
    checkBadges();
  }
  else if(a==='timerstop')stopTimer();
  else if(a==='addli'){const i=$('#li-name');if(i&&addLi(i.value)){const n=$('#li-name');if(n)n.focus();}}
  else if(a==='quickli')addLi(b.dataset.n);
  else if(a==='checkli'){const r=b.closest('.swipe');toggleLi(r.dataset.id);}
  else if(a==='clearli')clearDoneLi();
  else if(a==='sharelist')shareList();
  else if(a==='moveoverdue')moveOverdue();
  else if(a==='hidelate'){S.lateHide=todayKey();renderDay();}
  else if(a==='surprise')openSurprise();
  else if(a==='vmin'){VM.min=Number(b.dataset.m);pickSurprise();redraw();}
  else if(a==='vroll'){pickSurprise();redraw();}
  else if(a==='vadd')surpriseAdd(false);
  else if(a==='vnow')surpriseAdd(true);
  else if(a==='buy')buyItem(b.dataset.k,b.dataset.id);
  else if(a==='equip')equipItem(b.dataset.k,b.dataset.id);
  else if(a==='preview')previewTheme(b.dataset.id);
  else if(a==='useshield')useShield(b.dataset.key);
  else if(a==='tw'){TS.w=Number(b.dataset.w);redraw();}
  else if(a==='fw'){FM.w=Number(b.dataset.w);redraw();}
});
document.addEventListener('input',function(e){
  const id=e.target.id;
  if(id==='q'){S.q=e.target.value;renderTaskList();}
  else if(FM&&id==='f-name'){FM.name=e.target.value;FM.err='';}
  else if(FM&&id==='f-bname'){FM.bname=e.target.value;FM.err='';}
  else if(FM&&id==='f-bemoji'){FM.bemoji=e.target.value;}
  else if(TS&&id==='t-name'){TS.name=e.target.value;TS.err='';}
  else if(TS&&id==='t-note'){TS.note=e.target.value;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&CUR)closeSheet();
  if(e.key==='Enter'){
    const id=e.target.id;
    if(FM&&(id==='f-name'||id==='f-bname')){e.preventDefault();saveNewTask();}
    else if(TS&&(id==='t-name'||id==='t-note')){e.preventDefault();saveTaskSheet();}
    else if(id==='li-name'){e.preventDefault();const i=$('#li-name');if(addLi(i.value)){const n=$('#li-name');if(n)n.focus();}}
    else if(id==='p-name'){e.preventDefault();const i=$('#p-name');if(addPerson(i.value)){const n=$('#p-name');if(n)n.focus();}}
  }
});
let lastToday=todayKey();
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&todayKey()!==lastToday){lastToday=todayKey();goToday();}
});

/* ---------- start ---------- */
applyTheme();
applyThemeStyle();
const now=new Date();
S.weekStart=mondayOf(now);
S.sel=keyOf(now);
if(S.badges===null){S.badges=BADGES.filter(b=>b.cur(calcStats())>=b.goal).map(b=>b.id);save();}
S.anim=true;
renderAll();
runSplash();
})();
</script>
